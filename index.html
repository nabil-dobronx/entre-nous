const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=n=>{const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<n;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,seed){const a=arr.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function validImg(u){return typeof u==='string'&&u.length<9000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u)}
const range=n=>Array.from({length:n},(_,i)=>i);

const ss={get(k,d){try{const v=sessionStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- réseau (salle temps réel, avec repli local entre onglets) ----------
const Net={mode:'init',room:null,bc:null,mine:{},others:new Map(),conn:false,tab:rid(8),
 async init(){
  let r=null;
  try{if(window.claude&&typeof window.claude.use==='function')r=await window.claude.use('room')}catch(e){r=null}
  if(r){this.room=r;this.mode='room';
   r.onPeers(()=>onNet(),e=>{this.mode='err';onNet()});
   r.onConnection(c=>{this.conn=c;onNet()},()=>{});
   if(Object.keys(this.mine).length)r.presence(this.mine).catch(()=>{});
   onNet();return}
  // Les téléphones ralentissent les onglets en arrière-plan : on garde un joueur silencieux 25 s avant de le retirer.
  const beat=()=>setInterval(()=>{this.send('p');const now=Date.now();let ch=false;for(const[k,v]of this.others)if(now-v.ts>25000){this.others.delete(k);ch=true}if(ch)onNet()},2000);
  const hooks=()=>{addEventListener('pagehide',e=>{if(!e.persisted)this.send('bye')});
   addEventListener('pageshow',e=>{if(e.persisted)this.send('hello')});
   document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(this.mode==='mqtt'&&this.mq&&!this.mq.connected){try{this.mq.reconnect()}catch(_){}}this.send('hello');onNet()}})};
  if(await this.initMqtt()){beat();hooks();onNet();return}
  try{this.bc=new BroadcastChannel('entre-nous-v1');this.mode='local';this.conn=true;
   this.bc.onmessage=e=>this.onMsg(e.data);
   this.send('hello');beat();hooks();
  }catch(e){this.mode='none'}
  onNet();
 },
 onMsg(m){if(!m||!m.tab||m.tab===this.tab)return;
  if(m.t==='bye')this.others.delete(m.tab);else{this.others.set(m.tab,{p:m.p||{},ts:Date.now()});if(m.t==='hello')this.send('p')}
  onNet()},
 // ---- relais MQTT public (version hébergée hors claude.ai) ----
 mq:null,topic:null,
 async initMqtt(){
  if(!window.mqtt&&window.MQTT_READY){await Promise.race([window.MQTT_READY,new Promise(r=>setTimeout(r,9000))])}
  return new Promise(res=>{
  if(!window.mqtt||typeof window.mqtt.connect!=='function')return res(false);
  const brokers=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];let i=0;
  const tryB=()=>{if(i>=brokers.length)return res(false);const url=brokers[i++];let done=false;
   let c;try{c=window.mqtt.connect(url,{clientId:'en_'+this.tab+'_'+rid(4),reconnectPeriod:2000,connectTimeout:6000,clean:true,keepalive:30})}catch(e){return tryB()}
   const fail=()=>{if(done)return;done=true;try{c.end(true)}catch(e){}tryB()};
   const to=setTimeout(fail,7000);
   c.on('message',(t,buf)=>{if(this.mq!==c)return;try{this.onMsg(JSON.parse(buf.toString()))}catch(e){}});
   c.on('connect',()=>{if(!done){done=true;clearTimeout(to);this.mq=c;this.mode='mqtt';this.conn=true;this.sync(true);res(true)}
    else if(this.mq===c){this.conn=true;this.sync(true);onNet()}});
   c.on('close',()=>{if(this.mq===c){this.conn=false;onNet()}});
   c.on('offline',()=>{if(this.mq===c){this.conn=false;onNet()}});
   c.on('error',()=>{if(!this.mq)fail()});
  };tryB()})},
 // force = (re)connexion : on se réabonne sans oublier les joueurs déjà vus (évite le faux « hôte déconnecté »)
 sync(force){if(this.mode!=='mqtt'||!this.mq)return;const want=this.mine.code?'entrenous-v1/'+this.mine.code:null;
  if(want===this.topic&&!force)return;
  if(this.topic&&this.topic!==want){try{this.mq.publish(this.topic,JSON.stringify({t:'bye',tab:this.tab}));this.mq.unsubscribe(this.topic)}catch(e){}this.others.clear()}
  this.topic=want;
  if(want){this.mq.subscribe(want,{qos:0},()=>this.send('hello'))}
  onNet()},
 send(t){const msg={t,tab:this.tab,p:this.mine};
  if(this.mode==='mqtt'){if(this.mq&&this.topic&&this.mq.connected){try{this.mq.publish(this.topic,JSON.stringify(msg),{qos:0})}catch(e){}}return}
  try{this.bc&&this.bc.postMessage(msg)}catch(e){}},
 set(patch){for(const k in patch){if(patch[k]===null||patch[k]===undefined)delete this.mine[k];else this.mine[k]=patch[k]}
  if(this.mode==='room'){const p={};for(const k in patch){if(k==='img')continue;p[k]=patch[k]===undefined?null:patch[k]}if(Object.keys(p).length)this.room.presence(p).catch(e=>console.warn('presence',e))}
  else if(this.mode==='mqtt'){const want=this.mine.code?'entrenous-v1/'+this.mine.code:null;if(want!==this.topic)this.sync();else this.send('p')}
  else if(this.mode==='local')this.send('p');
  onNet()},
 list(){const out=[{self:true,p:this.mine}];
  if(this.mode==='room'){for(const pe of this.room.peers()){if(pe.isMe&&pe.sameTab)continue;out.push({self:false,p:pe.presence||{}})}}
  else for(const v of this.others.values())out.push({self:false,p:v.p});
  return out}
};
// requestAnimationFrame ne tourne pas quand l'onglet est caché : on bascule sur un timer pour que l'hôte continue d'arbitrer.
let rafq=0;function onNet(){if(rafq)return;const run=()=>{rafq=0;tick()};rafq=document.hidden?setTimeout(run,50):requestAnimationFrame(run)}

// ---------- joueurs ----------
function present(){if(!S.code)return[];const m=new Map();
 for(const{self,p}of Net.list()){if(!p||p.app!==APP||p.code!==S.code||!p.pid)continue;if(self||!m.has(p.pid)||!m.get(p.pid).self)m.set(p.pid,Object.assign({},p,{self}))}
 const g=G();const order=g?g.pl:[];
 return[...m.values()].sort((a,b)=>{const ia=order.indexOf(a.pid),ib=order.indexOf(b.pid);return(ia<0?999:ia)-(ib<0?999:ib)})}
function hostPeer(){let best=null;for(const{self,p}of Net.list()){if(!p||p.app!==APP||p.code!==S.code||!p.h||!p.st)continue;if(!best||(p.st.ep||0)>(best.st.ep||0))best=p}return best}
function G(){if(S.host)return S.st;const h=hostPeer();if(h)return h.st;return S.lastSt&&Date.now()-S.hostSeen<15000?S.lastSt:null}
function ans(p,g){g=g||G();return p&&p.a&&g&&p.a.k===g.r&&p.a.g===g.g?p.a.v:undefined}
function myAns(){return ans(Object.assign({},Net.mine))}
function pinfo(pid){const g=G();const ps=present();const p=ps.find(x=>x.pid===pid);
 const nm=p?[p.n,p.av]:(g&&g.nm&&g.nm[pid])||['?','❔'];const idx=g?g.pl.indexOf(pid):0;const av=nm[1]||'❔';const img=p&&validImg(p.img)?p.img:null;
 return{n:nm[0]||'?',av,img,a:img?`<img class="avi" src="${img}" alt="">`:`<span class="ave">${esc(av)}</span>`,c:COLORS[(idx<0?0:idx)%COLORS.length],here:!!p}}
function chip(pid,extra=''){const i=pinfo(pid);return`<span class="chip" style="--pc:${i.c}"><span class="av">${i.a}</span>${esc(i.n)}${extra}</span>`}
function firstName(pid){return pinfo(pid).n}

// ---------- hôte ----------
function newSt(){return{v:1,ep:Date.now(),r:0,g:null,ph:null,pl:[S.me.pid],nm:{},sc:{},n:0,cfg:{},seed:1,i:0,mi:-1}}
function pushSt(){if(!S.host||!S.st)return;const j=JSON.stringify(S.st);if(j===S.lastPushed)return;S.lastPushed=j;Net.set({st:JSON.parse(j)});ls.set('en_host_'+S.code,S.st)}
function hostTick(){
 if(!S.host||!S.st)return;
 // un autre hôte plus récent ? on lui cède la place
 for(const{self,p}of Net.list()){if(self||!p||p.app!==APP||p.code!==S.code||!p.h||!p.st)continue;if((p.st.ep||0)>(S.st.ep||0)){S.host=false;S.st=null;Net.set({h:null,st:null});saveSess();return}}
 const st=S.st,ps=present();
 for(const p of ps){if(!st.pl.includes(p.pid))st.pl.push(p.pid);st.nm[p.pid]=[String(p.n||'').slice(0,18),p.av];if(st.sc[p.pid]==null)st.sc[p.pid]=0}
 if(st.g&&st.ph!=='reveal'){const ex=expected(st,ps);if(ex&&ex.length&&ex.every(p=>ans(p,st)!==undefined))doReveal(st,ps)}
 pushSt();
}
function expected(g,ps){
 switch(g.g){
  case'roue':{const med=ps.find(p=>p.pid===g.med);if(!med||!ans(med,g))return null;return ps.filter(p=>p.pid!==g.med)}
  case'qdn':return ps.filter(p=>g.cfg.cp.includes(p.pid)).length===2?ps.filter(p=>g.cfg.cp.includes(p.pid)):null;
  case'duo':return ps.some(p=>p.pid===g.sub)&&ps.length>1?ps:null;
  case'tp':case'plus':return ps;
  case'imp':return g.ph==='vote'?ps:null;
 }return null}
function pick(st,list){const d=shuffled(list,st.seed);return d[st.i%d.length]}
function setupRound(st){
 const ps=present();const order=ps.map(p=>p.pid);
 st.r++;st.i++;st.n++;st.ph='play';st.last=null;
 switch(st.g){
  case'roue':st.mi=(st.mi+1)%Math.max(1,order.length);st.med=order[st.mi];st.sp=pick(st,range(SPECTRES.length));st.t=Math.round(12+Math.random()*156);break;
  case'qdn':{let l=range(QDN.length).filter(i=>st.cfg.cats.includes(QDN[i].c));if(!l.length)l=range(QDN.length);st.q=pick(st,l);break}
  case'duo':st.mi=(st.mi+1)%Math.max(1,order.length);st.sub=order[st.mi];st.q=pick(st,range(DUO.length));break;
  case'tp':st.q=pick(st,range(TP.length));break;
  case'plus':st.q=pick(st,range(PLUS.length));break;
  case'imp':st.ph='words';st.imp=order[Math.floor(Math.random()*order.length)];st.q=pick(st,range(IMP.length));st.sw=Math.random()<.5?0:1;st.first=order[Math.floor(Math.random()*order.length)];break;
 }
}
function addPts(st,last){st.last=last;for(const k in last)st.sc[k]=(st.sc[k]||0)+last[k]}
function zonePts(d){d=Math.abs(d);return d<=4?4:d<=11?3:d<=18?2:0}
function doReveal(st,ps){
 ps=ps||present();const last={};
 switch(st.g){
  case'roue':{let sum=0,n=0;for(const p of ps){if(p.pid===st.med)continue;const v=ans(p,st);if(typeof v!=='number')continue;const pts=zonePts(v-st.t);last[p.pid]=pts;sum+=pts;n++}
   if(n)last[st.med]=Math.round(sum/n);break}
  case'qdn':{const [a,b]=st.cfg.cp;const pa=ps.find(p=>p.pid===a),pb=ps.find(p=>p.pid===b);const va=ans(pa,st),vb=ans(pb,st);
   if(va&&vb){st.qn=(st.qn||0)+1;if(va===vb){st.m=(st.m||0)+1;last[a]=1;last[b]=1;for(const p of ps){if(st.cfg.cp.includes(p.pid))continue;if(ans(p,st)===va)last[p.pid]=1}}}break}
  case'tp':{let A=0,B=0;ps.forEach(p=>{const v=ans(p,st);if(v==='a')A++;if(v==='b')B++});if(A!==B){const w=A>B?'a':'b';ps.forEach(p=>{if(ans(p,st)===w)last[p.pid]=1})}break}
  case'plus':{const t={};ps.forEach(p=>{const v=ans(p,st);if(v)t[v]=(t[v]||0)+1});const mx=Math.max(0,...Object.values(t));const win=Object.keys(t).filter(k=>t[k]===mx);
   st.win=win;ps.forEach(p=>{if(win.includes(ans(p,st)))last[p.pid]=1});break}
  case'imp':{const t={};ps.forEach(p=>{const v=ans(p,st);if(v)t[v]=(t[v]||0)+1});const mx=Math.max(0,...Object.values(t));const top=Object.keys(t).filter(k=>t[k]===mx);
   st.out=top.length===1?top[0]:null;st.caught=st.out===st.imp;
   if(st.caught)ps.forEach(p=>{if(p.pid!==st.imp)last[p.pid]=1});else last[st.imp]=2;break}
 }
 if(st.g!=='duo')addPts(st,last);
 st.ph='reveal';
}
function doNext(st){
 if(st.g==='duo'&&st.ph==='reveal'){const subP=present().find(p=>p.pid===st.sub);const ok=subP&&subP.ok&&subP.ok.k===st.r?subP.ok.l:[];const last={};
  ok.forEach(pid=>{last[pid]=(last[pid]||0)+1;last[st.sub]=(last[st.sub]||0)+1});addPts(st,last);st.ddone=st.r}
 setupRound(st)}
function hostDo(fn){if(!S.host||!S.st)return;fn(S.st);pushSt();onNet()}

function L(id,fn){S.lives.push({id,fn,last:null});return`<div id="${id}">${fn()}</div>`}
function screen(){if(!S.code)return'home';const g=G();if(!g)return'wait';return g.g?'game':'lobby'}
function sigOf(){const sc=screen();const g=G();const ps=present();const parts=[sc,Net.mode,S.modal&&JSON.stringify(S.modal),S.host,ps.map(p=>p.pid+p.n+p.av+(p.img?p.img.length:0)).join(',')];
 if(sc==='wait')parts.push(!!S.lastSt,Date.now()-S.joinedAt>6000);
 if(g&&g.g){parts.push(g.g,g.ph,g.r,JSON.stringify(myAns()),S.showWord);
  if(g.g==='roue'){const m=ps.find(p=>p.pid===g.med);parts.push(!!ans(m,g))}
  if(g.ph==='reveal')parts.push(ps.map(p=>JSON.stringify(ans(p,g))).join('|'));
 }
 if(sc==='lobby')parts.push(JSON.stringify(g.cfg));
 return parts.join('§')}

// ----- la demi-roue -----
const CX=200,CY=205,R=185;
function pt(a,r){const t=a*Math.PI/180;return[CX-r*Math.cos(t),CY-r*Math.sin(t)]}
function wedge(a1,a2,r,fill){a1=Math.max(0,a1);a2=Math.min(180,a2);if(a2<=a1)return'';const[x1,y1]=pt(a1,r),[x2,y2]=pt(a2,r);return`<path d="M${CX} ${CY}L${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}Z" fill="${fill}"/>`}
function wheel(o){const sp=SPECTRES[o.sp];let z='';
 if(o.t!=null){const t=o.t;z+=wedge(t-18,t-11,R,'#ffd23f')+wedge(t-11,t-4,R,'#ff8a3d')+wedge(t-4,t+4,R,'#ff4d8d')+wedge(t+4,t+11,R,'#ff8a3d')+wedge(t+11,t+18,R,'#ffd23f');
  [[t-14.5,'2'],[t-7.5,'3'],[t,'4'],[t+7.5,'3'],[t+14.5,'2']].forEach(([a,l])=>{if(a<1||a>179)return;const[x,y]=pt(a,R-22);z+=`<text x="${x}" y="${y+6}" class="zl">${l}</text>`})}
 let nd='';(o.needles||[]).forEach(n=>{const[x,y]=pt(n.a,R-8);const[lx,ly]=pt(n.a,R-40);nd+=`<line x1="${CX}" y1="${CY}" x2="${x}" y2="${y}" stroke="${n.c}" stroke-width="5" stroke-linecap="round" opacity=".95"/>${n.img?`<clipPath id="cp${Math.round(n.a*10)}"><circle cx="${lx}" cy="${ly}" r="13"/></clipPath><image href="${n.img}" x="${lx-13}" y="${ly-13}" width="26" height="26" clip-path="url(#cp${Math.round(n.a*10)})"/><circle cx="${lx}" cy="${ly}" r="13" fill="none" stroke="${n.c}" stroke-width="2.5"/>`:`<text x="${lx}" y="${ly+7}" class="nl">${esc(n.l)}</text>`}`});
 let it='';if(o.inter){const[x,y]=pt(S.needle,R-8);it=`<line id="needle" x1="${CX}" y1="${CY}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle id="knob" cx="${x}" cy="${y}" r="13" fill="#fff" stroke="#1a0f33" stroke-width="3"/>`}
 return`<div class="wheelwrap"><svg id="${o.inter?'wheel':'wheelro'}" viewBox="0 0 400 215" class="wheel ${o.inter?'inter':''}">
  <defs><linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#3d6bff"/><stop offset=".5" stop-color="#7a4bd1"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient></defs>
  ${wedge(0,180,R,'url(#wg)')}${wedge(0,180,R-1,'rgba(20,10,40,.35)')}${z}${nd}${it}<circle cx="${CX}" cy="${CY}" r="16" fill="#1a0f33" stroke="#fff" stroke-width="3"/></svg>
  <div class="ends"><span class="e1">⟵ ${esc(sp[0])}</span><span class="e2">${esc(sp[1])} ⟶</span></div></div>`}
function bindWheel(){const svg=document.getElementById('wheel');if(!svg)return;let drag=false;
 const upd=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());let th=Math.atan2(CY-q.y,q.x-CX)*180/Math.PI;if(th<0)th=q.x<CX?180:0;let a=180-th;a=Math.max(0,Math.min(180,a));S.needle=Math.round(a*10)/10;
  const[x,y]=pt(S.needle,R-8);const n=document.getElementById('needle'),k=document.getElementById('knob');n.setAttribute('x2',x);n.setAttribute('y2',y);k.setAttribute('cx',x);k.setAttribute('cy',y)};
 svg.addEventListener('pointerdown',e=>{drag=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}upd(e);e.preventDefault()});
 svg.addEventListener('pointermove',e=>{if(drag)upd(e)});
 svg.addEventListener('pointerup',()=>drag=false);svg.addEventListener('pointercancel',()=>drag=false)}
function vRoue(g){const ps=present();const isMed=S.me.pid===g.med;const medP=ps.find(p=>p.pid===g.med);const ma=ans(medP,g);const clue=ma&&ma.c;const mine=myAns();
 const guessers=()=>present().filter(p=>p.pid!==g.med);
 const head=`<div class="role">🔮 Médium : ${chip(g.med)}</div>`;
 if(g.ph==='reveal'){const needles=ps.filter(p=>p.pid!==g.med&&typeof ans(p,g)==='number').map(p=>{const i=pinfo(p.pid);return{a:ans(p,g),c:i.c,l:i.av,img:i.img}});
  return`${head}<div class="clue">« ${esc(clue||'—')} »</div>${wheel({sp:g.sp,t:g.t,needles})}${lastPts()}`}
 if(isMed){if(!clue){S.after.push(()=>{const i=document.getElementById('clue');i&&i.focus()});
   return`${head}<div class="card hint">C'est toi le médium ! La cible est cachée ici. Donne <b>un indice</b> pour que les autres la trouvent.</div>${wheel({sp:g.sp,t:g.t})}
   <div class="row"><input id="clue" class="txt" maxlength="40" placeholder="Ton indice…" autocomplete="off"><button class="btn pink" data-act="sendclue">Envoyer</button></div>`}
  return`${head}<div class="clue">« ${esc(clue)} »</div>${wheel({sp:g.sp,t:g.t})}<p class="mut c">Les autres cherchent la cible…</p>${L('stat',()=>statusHTML(guessers()))}`}
 if(!clue)return`${head}${wheel({sp:g.sp})}<div class="card c pulse">🔮 ${esc(firstName(g.med))} réfléchit à un indice…</div>`;
 if(typeof mine==='number')return`${head}<div class="clue">« ${esc(clue)} »</div>${wheel({sp:g.sp,needles:[{a:mine,c:pinfo(S.me.pid).c,l:S.me.av,img:pinfo(S.me.pid).img}]})}<p class="mut c">Aiguille verrouillée ✓ En attente des autres…</p>${L('stat',()=>statusHTML(guessers()))}`;
 S.after.push(bindWheel);
 return`${head}<div class="clue">« ${esc(clue)} »</div>${wheel({sp:g.sp,inter:true})}<p class="mut c">Fais glisser l'aiguille, puis valide.</p><button class="btn pink block" data-act="lockneedle">Valider ma réponse</button>${L('stat',()=>statusHTML(guessers()))}`}

function vQdn(g){const cp=g.cfg.cp||[];const inC=cp.includes(S.me.pid);const other=cp.find(p=>p!==S.me.pid);const q=QDN[g.q];const mine=myAns();const ps=present();
 const score=`<div class="agree">Accord : <b>${g.m||0}</b> / ${g.qn||0}${g.qn?` · ${Math.round(100*(g.m||0)/g.qn)}%`:''}</div>`;
 const qcard=`<div class="qcard" style="--gc:${GAMES.qdn.c}"><div class="qpre">Qui de nous deux…</div><div class="qtxt">${esc(q.q)}</div><div class="qcat">${QDN_CATS[q.c].label}</div></div>`;
 if(cp.length<2)return`<div class="card">Il faut 2 joueurs pour ce jeu.</div>`;
 if(g.ph==='reveal'){const pa=ps.find(p=>p.pid===cp[0]),pb=ps.find(p=>p.pid===cp[1]);const va=ans(pa,g),vb=ans(pb,g);const same=va&&va===vb;
  const who=(v,self)=>v?(v===self?'Moi !':esc(firstName(v))):'—';
  const bets=ps.filter(p=>!cp.includes(p.pid)&&ans(p,g));
  return`${score}${qcard}<div class="rev2">
   <div class="rv" style="--pc:${pinfo(cp[0]).c}"><div class="rvn">${pinfo(cp[0]).a} ${esc(firstName(cp[0]))}</div><div class="rva">${who(va,cp[0])}</div><div class="rvs">désigne ${va?pinfo(va).a+' '+esc(firstName(va)):'—'}</div></div>
   <div class="rv" style="--pc:${pinfo(cp[1]).c}"><div class="rvn">${pinfo(cp[1]).a} ${esc(firstName(cp[1]))}</div><div class="rva">${who(vb,cp[1])}</div><div class="rvs">désigne ${vb?pinfo(vb).a+' '+esc(firstName(vb)):'—'}</div></div></div>
   <div class="verdict ${same?'yes':'no'}">${same?`💚 Même réponse : ${esc(firstName(va))} !`:va&&vb?'💥 Pas d\'accord !':'Réponse manquante'}</div>
   ${bets.length?`<div class="bets"><span class="mut">Paris :</span> ${bets.map(p=>chip(p.pid,` → ${esc(firstName(ans(p,g)))}`)).join('')}</div>`:''}`}
 const stat=L('stat',()=>statusHTML(present().filter(p=>cp.includes(p.pid))));
 if(inC){return`${score}${qcard}<div class="choice2">
   <button class="big2 ${mine===S.me.pid?'on':''}" data-act="ans" data-v="${S.me.pid}" style="--pc:${pinfo(S.me.pid).c}"><span>${pinfo(S.me.pid).a}</span>Moi</button>
   <button class="big2 ${mine===other?'on':''}" data-act="ans" data-v="${other}" style="--pc:${pinfo(other).c}"><span>${pinfo(other).a}</span>${esc(firstName(other))}</button></div>
   ${mine?'<p class="mut c">Réponse enregistrée. On attend l\'autre…</p>':''}${stat}`}
 return`${score}${qcard}<p class="mut c">Tu es spectateur. Ton pari :</p><div class="choice2">${cp.map(pid=>`<button class="big2 ${mine===pid?'on':''}" data-act="ans" data-v="${pid}" style="--pc:${pinfo(pid).c}"><span>${pinfo(pid).a}</span>${esc(firstName(pid))}</button>`).join('')}</div>${stat}`}

function vDuo(g){const isSub=S.me.pid===g.sub;const q=DUO[g.q];const name=firstName(g.sub);const mine=myAns();const ps=present();
 const head=`<div class="role">🎯 Question sur : ${chip(g.sub)}</div>`;

   ${isSub?'<p class="mut c">Touche les réponses qui correspondent à la tienne ✓</p>':''}
   ${L('guesses',()=>{const sp=present().find(p=>p.pid===g.sub);const ok=sp&&sp.ok&&sp.ok.k===g.r?sp.ok.l:[];
     return`<div class="guesses">${present().filter(p=>p.pid!==g.sub).map(p=>{const v=ans(p,g);const on=ok.includes(p.pid);const i=pinfo(p.pid);
      return`<${isSub?'button data-act="okt" data-v="'+p.pid+'"':'div'} class="gs ${on?'on':''}" style="--pc:${i.c}"><span class="gsn">${i.a} ${esc(i.n)}</span><span class="gsv">${esc(v||'—')}</span><span class="gsk">${on?'✓':isSub?'○':''}</span></${isSub?'button':'div'}>`}).join('')}</div>`})}`}
 const stat=L('stat',()=>statusHTML(present()));
 const qtxt=isSub?q[0]:q[1].replace('{N}',name);
 if(mine!==undefined)return`${head}<div class="qcard" style="--gc:${GAMES.duo.c}"><div class="qtxt">${esc(qtxt)}</div></div><div class="sent">Ta réponse : <b>${esc(mine)}</b></div><p class="mut c">En attente des autres…</p>${stat}`;
 S.after.push(()=>{const i=document.getElementById('dans');i&&i.focus()});
 return`${head}<div class="qcard" style="--gc:${GAMES.duo.c}">${isSub?'<div class="qpre">Question sur toi</div>':`<div class="qpre">Devine ce que ${esc(name)} va répondre</div>`}<div class="qtxt">${esc(qtxt)}</div></div>

 if(g.ph==='reveal'){const A=ps.filter(p=>ans(p,g)==='a'),B=ps.filter(p=>ans(p,g)==='b');const tot=Math.max(1,A.length+B.length);

function vImp(g){const pair=IMP[g.q];const isImp=S.me.pid===g.imp;const blanc=g.cfg.mode==='blanc';const myWord=isImp?(blanc?null:pair[1-g.sw]):pair[g.sw];const mine=myAns();const ps=present();
 if(g.ph==='reveal'){const t={};ps.forEach(p=>{const v=ans(p,g);if(v)t[v]=(t[v]||0)+1});
  return`<div class="verdict ${g.caught?'yes':'no'}">${g.caught?'🎉 Imposteur démasqué !':g.out?`😈 Raté ! Vous avez éliminé ${esc(firstName(g.out))}…`:'😈 Égalité : l\'imposteur s\'en sort !'}</div>
  <div class="truth"><div class="lbl">L'imposteur était</div><div class="tv">${pinfo(g.imp).a} ${esc(firstName(g.imp))}</div></div>
  <div class="words"><div><span class="lbl">Mot des autres</span><b>${esc(pair[g.sw])}</b></div><div><span class="lbl">Mot de l'imposteur</span><b>${blanc?'(aucun — Mister White)':esc(pair[1-g.sw])}</b></div></div>
  <div class="bars">${Object.keys(t).sort((a,b)=>t[b]-t[a]).map(pid=>{const i=pinfo(pid);return`<div class="bar" style="--pc:${i.c}"><div class="bn">${i.a} ${esc(i.n)}</div><div class="bt"><div class="bf" style="width:${100*t[pid]/Math.max(...Object.values(t))}%"></div><span>${t[pid]} vote${t[pid]>1?'s':''}</span></div></div>`}).join('')}</div>${lastPts()}`}
 if(g.ph==='words'){return`<div class="card c"><div class="lbl">Ton mot secret</div>
   ${S.showWord?`<div class="secret">${myWord?esc(myWord):'🤫 Tu n\'as pas de mot :<br>tu es Mister White !'}</div>${!myWord?'<p class="mut">Écoute les autres et bluffe.</p>':''}<button class="btn ghost" data-act="word">Cacher</button>`
   :`<button class="btn pink" data-act="word">👀 Afficher mon mot</button>`}</div>
   <div class="card"><p>🗣️ À tour de rôle, chacun dit <b>un mot</b> en rapport avec son mot secret, à voix haute ou en appel. Ne sois ni trop clair, ni trop vague !</p><p>Commence : ${chip(g.first)}</p></div>
   ${S.host?'':'<p class="mut c">L\'hôte lancera le vote quand tout le monde aura parlé.</p>'}`}
 return`<div class="qpre c">🗳️ Qui est l'imposteur ?</div><div class="pgrid">${ps.filter(p=>!p.self).map(p=>{const i=pinfo(p.pid);return`<button class="pbtn ${mine===p.pid?'on':''}" data-act="ans" data-v="${p.pid}" style="--pc:${i.c}"><span>${i.a}</span>${esc(i.n)}</button>`}).join('')}</div>
  <p class="mut c">Rappel de ton mot : <b>${myWord?esc(myWord):'aucun'}</b></p>${L('stat',()=>statusHTML(present()))}`}

// ----- modales -----
function vModal(){const m=S.modal;let h='';
 if(m.t==='invite'){h=`<h2>📨 Inviter des amis</h2><p>Envoie ce lien (le code est dedans) :</p><input class="txt" id="invurl" readonly value="${esc(m.url||S.code)}" onclick="this.select()"><p class="mut">Ou donne simplement le code : <b class="inl-code">${esc(S.code)}</b></p><button class="btn block" data-act="close">OK</button>`}
 else if(m.t==='rules'){const x=GAMES[m.g];h=`<h2>${x.e} ${esc(x.n)}</h2><p>${x.r}</p><p class="mut">${x.min} joueurs minimum.</p><button class="btn block" data-act="close">Compris</button>`}
 else if(m.t==='scores'){const g=G();const ids=g?g.pl.filter(pid=>g.sc[pid]!=null):[];ids.sort((a,b)=>(g.sc[b]||0)-(g.sc[a]||0));
  h=`<h2>🏆 Scores</h2><div class="sclist">${ids.map((pid,i)=>{const p=pinfo(pid);return`<div class="scr ${p.here?'':'gone'}" style="--pc:${p.c}"><span class="rk">${['🥇','🥈','🥉'][i]||i+1}</span><span class="av">${p.a}</span><span class="pn">${esc(p.n)}</span><b>${g.sc[pid]||0}</b></div>`}).join('')||'<p class="mut">Pas encore de points.</p>'}</div>
  ${S.host?'<button class="btn ghost block" data-act="resetsc">Remettre les scores à zéro</button>':''}<button class="btn block" data-act="close">Fermer</button>`}
 else if(m.t==='cfg'){const x=GAMES[m.g];const ps=present();const enough=ps.length>=x.min;let opts='';
  if(m.g==='qdn'){const opt=sel=>ps.map(p=>`<option value="${p.pid}" ${p.pid===sel?'selected':''}>${esc(p.av)} ${esc(p.n)}</option>`).join('');
   opts=`<div class="lbl">Le couple</div><div class="row"><select id="c1" class="txt">${opt(ps[0]&&ps[0].pid)}</select><span>💞</span><select id="c2" class="txt">${opt(ps[1]&&ps[1].pid)}</select></div>
   <div class="lbl">Thèmes</div><div class="cats">${Object.entries(QDN_CATS).map(([k,c])=>`<label class="cat"><input type="checkbox" id="cat-${k}" checked> ${c.label} <span class="mut">(${c.q.length})</span></label>`).join('')}</div>`}
  if(m.g==='imp')opts=`<div class="lbl">Mode</div><select id="impmode" class="txt"><option value="mot">Undercover : l'imposteur a un mot proche (et ne sait pas qu'il l'est)</option><option value="blanc">Mister White : l'imposteur n'a aucun mot</option></select>`;
  h=`<h2>${x.e} ${esc(x.n)}</h2><p>${x.r}</p>${opts}${enough?'':`<p class="warn">Il faut au moins ${x.min} joueurs connectés (${ps.length} actuellement).</p>`}
  <div class="row"><button class="btn ghost" data-act="close">Annuler</button><button class="btn pink grow" data-act="start" data-g="${m.g}" ${enough?'':'disabled'}>Lancer le jeu</button></div>`}
 return`<div class="ov" data-act="ovclose"><div class="modal" role="dialog">${h}</div></div>`}

// ---------- actions ----------
const ACT={
 av(el){S.me.av=el.dataset.v;S.me.img=null;saveMe();S.sig='';onNet()},
 photo(){const f=$('#photo');f&&f.click()},
 nophoto(){S.me.img=null;saveMe();S.sig='';onNet()},
 create(){if(!readName())return;enter(rid(5),true)},
 join(){if(!readName())return;const c=($('#jcode').value||'').trim().toLowerCase();if(!/^[a-z0-9]{4,8}$/.test(c))return toast('Code invalide');enter(c,false)},
 leave(){leave()},
 takeover(){S.host=true;S.st=JSON.parse(JSON.stringify(S.lastSt));S.st.ep=Date.now();Net.set({h:true});S.lastPushed='';pushSt();saveSess();toast('Tu es maintenant l\'hôte')},
 copy(){const url=SHARE_URL?`${SHARE_URL}#${S.code}`:'';const t=`Rejoins ma partie Entre Nous 🎉 Code : ${S.code}`;
  const fallback=()=>{S.modal={t:'invite',url};onNet()};
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){navigator.share({title:'Entre Nous',text:t,url:url||undefined}).catch(e=>{if(e&&e.name!=='AbortError')fallback()});return}
  try{navigator.clipboard.writeText(url?t+'\n'+url:t).then(()=>toast('Invitation copiée !'),fallback)}catch(e){fallback()}},
 rules(el){S.modal={t:'rules',g:el.dataset.g};onNet()},
 scores(){S.modal={t:'scores'};onNet()},
 cfg(el){S.modal={t:'cfg',g:el.dataset.g};onNet()},
 close(){S.modal=null;onNet()},
 ovclose(el,e){if(e.target===el){S.modal=null;onNet()}},
 start(el){const k=el.dataset.g;const cfg={};
  if(k==='qdn'){const a=$('#c1').value,b=$('#c2').value;if(!a||!b||a===b)return toast('Choisis deux joueurs différents');cfg.cp=[a,b];cfg.cats=Object.keys(QDN_CATS).filter(c=>$('#cat-'+c).checked);if(!cfg.cats.length)return toast('Choisis au moins un thème')}
  if(k==='imp')cfg.mode=$('#impmode').value;
  S.modal=null;hostDo(st=>{st.g=k;st.cfg=cfg;st.seed=Math.floor(Math.random()*1e9);st.i=-1;st.n=0;st.m=0;st.qn=0;st.mi=-1;setupRound(st)})},
 tolobby(){hostDo(st=>{st.g=null;st.ph=null})},
 next(){hostDo(doNext)},
 reveal(){hostDo(st=>doReveal(st))},
 tovote(){hostDo(st=>{st.ph='vote'})},
 resetsc(){hostDo(st=>{for(const k in st.sc)st.sc[k]=0;st.m=0;st.qn=0})},
 ans(el){answer(el.dataset.v)},
 sendclue(){const v=($('#clue').value||'').trim();if(!v)return toast('Écris un indice');answer({c:v.slice(0,40)})},
 lockneedle(){answer(S.needle)},
 sendtxt(){const v=($('#dans').value||'').trim();if(!v)return toast('Écris ta réponse');answer(v.slice(0,60))},
 okt(el){const g=G();const cur=Net.mine.ok&&Net.mine.ok.k===g.r?Net.mine.ok.l.slice():[];const v=el.dataset.v;const i=cur.indexOf(v);if(i<0)cur.push(v);else cur.splice(i,1);Net.set({ok:{k:g.r,l:cur}})},
 word(){S.showWord=!S.showWord;onNet()}
};
function readName(){const n=($('#name').value||'').trim().slice(0,18);if(!n){toast('Entre ton prénom');$('#name').focus();return false}S.me.n=n;saveMe();return true}
function saveMe(){ls.set('en_me',{n:S.me.n,av:S.me.av,img:S.me.img||null})}
// photo de profil : recadrée en carré 80 px et compressée (~3 Ko) pour passer dans les messages temps réel
function loadPhoto(file){if(!file||!/^image\//.test(file.type))return toast('Choisis une image');const url=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{URL.revokeObjectURL(url);const c=document.createElement('canvas');c.width=c.height=80;const x=c.getContext('2d');const s=Math.min(im.width,im.height);
  x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,80,80);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>7000&&q>.3){q-=.15;d=c.toDataURL('image/jpeg',q)}
  if(!validImg(d))return toast('Image impossible à utiliser');const n=$('#name');if(n)S.me.n=(n.value||'').trim().slice(0,18);S.me.img=d;saveMe();S.sig='';onNet()};
 im.onerror=()=>{URL.revokeObjectURL(url);toast('Image illisible')};im.src=url}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='photo'){loadPhoto(e.target.files&&e.target.files[0]);e.target.value=''}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target&&e.target.id;
 const map={clue:'sendclue',dans:'sendtxt',jcode:'join',name:null};if(id in map&&map[id])ACT[map[id]]()});
// reset showWord à chaque manche
let lastR=null;setInterval(()=>{const g=G();if(g&&g.r!==lastR){lastR=g.r;if(S.showWord){S.showWord=false;onNet()}}},400);

// ---------- démarrage ----------
(function boot(){
 render();banner();
 let sess=ss.get('en_sess',null)||ls.get('en_sess',null);if(sess&&Date.now()-(sess.t||0)>6*3600e3)sess=null;
 const hc=(location.hash||'').slice(1).toLowerCase();
 if(sess&&sess.code&&S.me.n&&(!/^[a-z0-9]{4,8}$/.test(hc)||hc===sess.code))enter(sess.code,!!sess.host);
 Net.init();
 setInterval(onNet,1500);
})();

</script>
