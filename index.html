<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="description" content="Mini-jeux à plusieurs : demi-roue, Qui de nous deux, Même réponse, Tu préfères, Imposteur…">

<meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0f33;--card:#2a1a55;--card2:#352268;--line:rgba(255,255,255,.12);--tx:#fff6fb;--mut:#bfb0e6;--pink:#ff4d8d;--yel:#ffd23f;--teal:#2de2c4;--ora:#ff8a3d;--vio:#8f7bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font-family:Nunito,system-ui,sans-serif;font-weight:700}
body{min-height:100vh;background:radial-gradient(900px 520px at 0% -10%,#47207f 0%,transparent 60%),radial-gradient(800px 500px at 110% 0%,#6a1650 0%,transparent 55%),var(--bg);background-attachment:fixed}
#app{max-width:680px;margin:0 auto;padding:14px 16px 110px}
h1,h2,h3{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;margin:0 0 8px}
h2{font-size:26px}h3{font-size:20px}
p{line-height:1.45;margin:8px 0}
.mut{color:var(--mut);font-weight:600}.c{text-align:center}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);font-weight:800;margin:14px 0 8px;display:block}
.lbl:first-child{margin-top:0}
.hero{text-align:center;padding:26px 0 18px}
.logo{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:54px;line-height:1;letter-spacing:-1px;transform:rotate(-2deg)}
.logo span,.logo-s span{color:var(--pink)}
.tag{color:var(--mut);max-width:420px;margin:12px auto 0;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two .card{margin:0}
@media(max-width:560px){.two{grid-template-columns:1fr}.two .card{margin:0}}
.cta h3{margin-bottom:2px}.cta p{margin:4px 0 14px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;margin:12px 0}.grow{flex:1}
.btn{appearance:none;border:0;border-radius:16px;padding:14px 18px;font:800 16px Nunito,sans-serif;cursor:pointer;color:#1a0f33;background:var(--yel);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.pink{background:var(--pink);color:#fff}.btn.teal{background:var(--teal)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.block{width:100%;display:block}
.btn[disabled]{opacity:.4;pointer-events:none}
.txt{width:100%;min-width:0;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#140a2a;color:var(--tx);font:700 17px Nunito,sans-serif;outline:none}
.txt:focus{border-color:var(--pink)}
select.txt{padding:12px}
.txt.code{text-transform:lowercase;letter-spacing:.2em;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:20px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:420px){.avs{grid-template-columns:repeat(4,1fr)}}
.avb{aspect-ratio:1;border-radius:50%;border:3px solid transparent;background:none;cursor:pointer;padding:0;overflow:hidden;opacity:.6;transition:transform .12s,opacity .12s,border-color .12s}
.avb img{width:100%;height:100%;object-fit:cover;display:block}
.avb.on{border-color:var(--pink);opacity:1;transform:scale(1.08);box-shadow:0 0 0 4px rgba(255,77,141,.25)}
.avb:hover{opacity:1}
.gl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.gmini{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mut);background:rgba(255,255,255,.04)}
.gmini span{margin-right:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px}
.tt{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:22px;display:flex;gap:8px;align-items:center}
.logo-s{font-weight:700;font-size:26px}
.tbtns{display:flex;gap:6px}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--tx);font:800 18px Nunito,system-ui,sans-serif;cursor:pointer}
.invite{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#ff4d8d22,#8f7bff22),var(--card)}
.bigcode{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:44px;font-weight:700;letter-spacing:.18em;color:var(--yel);line-height:1}
.hrow{display:flex;justify-content:space-between;align-items:baseline}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.05);border-left:4px solid var(--pc)}
.pl .av{font-size:26px;line-height:0}.pl .pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl i{color:var(--mut);font-style:normal;font-size:12px}
.psc{font-family:Fredoka,Nunito,system-ui,sans-serif;color:var(--yel)}
.sect{margin:22px 0 4px}.waitmsg{margin:0 0 8px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media(max-width:520px){.games{grid-template-columns:1fr}}
.game{text-align:left;cursor:pointer;color:var(--tx);border:0;border-radius:22px;padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 34%,transparent),transparent 70%),var(--card);border:1px solid color-mix(in srgb,var(--gc) 45%,transparent);display:flex;flex-direction:column;gap:4px;font-family:Nunito,system-ui,sans-serif;transition:transform .1s}
.game:hover{transform:translateY(-2px)}
.ge{font-size:34px}.gn{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:20px}.gd{color:var(--mut);font-size:14px;font-weight:600;line-height:1.35}.gm{font-size:12px;color:var(--gc);margin-top:4px;font-weight:800}
.rnd{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);margin:0 0 6px}
.role{margin:4px 0 10px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:999px;background:color-mix(in srgb,var(--pc) 22%,transparent);border:1px solid color-mix(in srgb,var(--pc) 60%,transparent);margin:2px;font-size:14px}
.chip .av{font-size:16px}
.qcard{border-radius:26px;padding:24px 20px;margin:10px 0 14px;text-align:center;background:linear-gradient(150deg,color-mix(in srgb,var(--gc) 45%,#2a1a55),#2a1a55 80%);border:1px solid color-mix(in srgb,var(--gc) 50%,transparent);box-shadow:0 10px 30px -12px color-mix(in srgb,var(--gc) 60%,transparent)}
.qpre{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:#ffe9f3;opacity:.85;margin-bottom:8px;font-weight:800}
.qpre.c{margin:16px 0 6px;color:var(--mut)}
.qtxt{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:28px;line-height:1.2;font-weight:600}
.qcat{margin-top:10px;font-size:13px;opacity:.75}
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.big2{border:2px solid color-mix(in srgb,var(--pc) 55%,transparent);background:color-mix(in srgb,var(--pc) 14%,var(--card));color:var(--tx);border-radius:22px;padding:20px 10px;font:800 20px Fredoka,Nunito,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .1s}
.big2 span{font-size:40px}
.big2.on{background:var(--pc);color:#1a0f33;transform:scale(1.03)}
.agree{text-align:center;font-size:15px;color:var(--mut)}.agree b{color:var(--teal);font-size:20px}
.rev2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rv{border-radius:20px;padding:16px;text-align:center;background:color-mix(in srgb,var(--pc) 16%,var(--card));border:2px solid color-mix(in srgb,var(--pc) 50%,transparent);animation:pop .4s ease both}
.rv:nth-child(2){animation-delay:.15s}
.rvn{font-size:14px;color:var(--mut)}.rva{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:26px;margin:6px 0}.rvs{font-size:13px;color:var(--mut)}
.verdict{margin:14px 0;border-radius:20px;padding:16px;text-align:center;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:24px;animation:pop .5s .25s ease both}
.verdict.yes{background:linear-gradient(135deg,#2de2c4,#5ad1ff);color:#10213a}.verdict.no{background:linear-gradient(135deg,#ff4d8d,#ff8a3d);color:#fff}
@keyframes pop{0%{opacity:0;transform:scale(.85)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.bets{text-align:center;margin:8px 0}
.status{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.st{position:relative;font-size:30px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:2px dashed color-mix(in srgb,var(--pc) 60%,transparent);opacity:.65}
.st.ok{opacity:1;border-style:solid;background:color-mix(in srgb,var(--pc) 25%,transparent)}
.st b{position:absolute;right:-4px;bottom:-4px;font-size:11px;background:var(--bg);border-radius:999px;padding:1px 4px;border:1px solid var(--line)}
.st.ok b{background:var(--teal);color:#10213a}
.hctl{margin-top:18px}
.hint{font-size:15px;background:linear-gradient(135deg,#ff4d8d33,transparent),var(--card)}
.clue{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:30px;text-align:center;margin:6px 0 4px;color:var(--yel)}
.wheelwrap{margin:6px auto 4px;max-width:520px}
.wheel{width:100%;display:block;touch-action:none;user-select:none}
.wheel.inter{cursor:grab}
.zl{fill:#1a0f33;font:800 16px Fredoka,Nunito,system-ui,sans-serif;text-anchor:middle}
.nl{font-size:20px;text-anchor:middle}
.ends{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:17px}
.e1{color:#8fb0ff}.e2{color:#ff8fa5;text-align:right}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.55}}
.pts{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:12px 0}.pts b{color:var(--yel)}
.truth{text-align:center;margin:12px 0;padding:16px;border-radius:20px;background:var(--card2);border:1px solid var(--line)}
.truth .lbl{margin:0 0 4px}.tv{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:30px;color:var(--teal)}
.guesses{display:grid;gap:8px}
.gs{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line);color:var(--tx);font:700 16px Nunito,system-ui,sans-serif;text-align:left;width:100%}
button.gs{cursor:pointer}
.gs.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 18%,var(--card))}
.gsn{color:var(--mut);font-size:14px;min-width:90px}.gsv{flex:1;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:20px}.gsk{font-size:22px;color:var(--teal)}
.sent{text-align:center;font-size:18px;margin:10px 0}
.tpch,.tprev{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:10px 0}
@media(max-width:520px){.tpch,.tprev{grid-template-columns:1fr}}
.ou{align-self:center;justify-self:center;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:20px;color:var(--mut)}
.tpb{border:0;border-radius:24px;padding:26px 14px;font:600 22px Fredoka,Nunito,system-ui,sans-serif;cursor:pointer;color:#1a0f33;min-height:130px;transition:transform .1s;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.tpb.a,.tpc.a{background:linear-gradient(160deg,#ffd23f,#ff8a3d)}.tpb.b,.tpc.b{background:linear-gradient(160deg,#5ad1ff,#8f7bff)}
.tpb.on{outline:4px solid #fff;transform:scale(1.03)}
.tpch:has(.on) .tpb:not(.on){opacity:.45}
.tpc{border-radius:24px;padding:18px;color:#1a0f33;text-align:center;animation:pop .4s ease both}
.tpp{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:40px;line-height:1}.tpt{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:20px;margin:6px 0 10px}
.tpl .chip{background:rgba(255,255,255,.55);border-color:transparent;color:#1a0f33}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0}
.pbtn{border:2px solid color-mix(in srgb,var(--pc) 55%,transparent);background:color-mix(in srgb,var(--pc) 12%,var(--card));color:var(--tx);border-radius:20px;padding:14px 8px;font:800 16px Nunito,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.pbtn span{font-size:34px}.pbtn.on{background:var(--pc);color:#1a0f33}
.bars{display:grid;gap:10px;margin:12px 0}
.bn{font-size:15px;margin-bottom:4px}
.bt{position:relative;height:34px;border-radius:12px;background:rgba(255,255,255,.06);overflow:hidden}
.bf{position:absolute;inset:0 auto 0 0;background:var(--pc);border-radius:12px;animation:grow .7s ease both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.bt span{position:relative;line-height:34px;padding-left:12px;color:#1a0f33;font-weight:900;text-shadow:0 0 6px rgba(255,255,255,.5)}
.secret{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:40px;color:var(--yel);margin:12px 0}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}.words>div{background:var(--card);border-radius:18px;padding:12px;text-align:center;border:1px solid var(--line)}.words b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:20px;display:block}
.words .lbl{margin:0 0 4px}
.ov{position:fixed;inset:0;background:rgba(10,4,24,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
@media(min-width:600px){.ov{align-items:center}}
.modal{background:#2a1a55;border:1px solid var(--line);border-radius:26px;padding:22px;max-width:520px;width:100%;max-height:88vh;overflow:auto;animation:pop .25s ease both}
.modal .btn.block{margin-top:10px}
.cats{display:grid;gap:8px}.cat{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);cursor:pointer}
.cat input{width:18px;height:18px;accent-color:var(--pink)}
.warn{color:var(--ora)}
.sclist{display:grid;gap:8px;margin:12px 0}
.scr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.05);border-left:4px solid var(--pc)}
.scr.gone{opacity:.5}.scr .rk{width:28px;text-align:center}.scr .av{font-size:22px}.scr .pn{flex:1}.scr b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:20px;color:var(--yel)}
.avi{width:1.15em;height:1.15em;border-radius:50%;object-fit:cover;vertical-align:middle;display:inline-block}
.big2 .avi,.pbtn .avi{width:44px;height:44px;border:3px solid var(--pc)}
.me-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.me-av{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:36px;overflow:hidden;border:3px solid var(--pink);flex:none}
.me-av img{width:100%;height:100%;object-fit:cover}
.me-btns{display:flex;gap:8px;flex-wrap:wrap}.me-btns .btn{padding:10px 14px;font-size:14px}
.inl-code{font-family:Fredoka,Nunito,system-ui,sans-serif;color:var(--yel);letter-spacing:.15em;font-size:18px}
.timer{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:-4px 0 14px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--yel),var(--pink));animation:tdown linear forwards;border-radius:99px}
@keyframes tdown{to{width:0}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
@media(max-width:420px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;border:0;border-radius:18px;padding:16px 14px;min-height:70px;background:var(--oc);color:#1a0f33;font:800 17px Nunito,system-ui,sans-serif;text-align:left;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .1s,opacity .15s;position:relative}
.opt:active{transform:translateY(3px)}
.opt .sh{font-size:20px;opacity:.7}.opt .ot{flex:1;line-height:1.2}
.opt.on{outline:4px solid #fff;transform:scale(1.02)}.opt.dim{opacity:.35}.opt[disabled]{cursor:default}
.opts.rev .opt.bad{opacity:.35;filter:saturate(.4)}.opts.rev .opt.good{outline:4px solid #fff;animation:pop .5s ease both}
.whopick{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;font-size:22px}
.vfch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.vfb{border:0;border-radius:24px;padding:30px 10px;font:700 28px Fredoka,Nunito,system-ui,sans-serif;cursor:pointer;color:#1a0f33;box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .1s,opacity .15s}
.vfb.t{background:linear-gradient(160deg,#a6ff4d,#2de2c4)}.vfb.f{background:linear-gradient(160deg,#ff8a3d,#ff4d8d);color:#fff}
.vfb.on{outline:4px solid #fff;transform:scale(1.03)}.vfb.dim{opacity:.35}
.vfrev{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vfc{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;min-height:70px}
.vfc.good{border-color:var(--teal)}.vfc b{display:block;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:18px;margin-bottom:6px}.vfc .whopick{justify-content:center}
.expl{font-size:16px;color:var(--mut);margin-top:-4px}
.clues{display:grid;gap:8px;margin:0 0 6px}
.clue-i{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-size:17px;animation:pop .4s ease both}
.clue-i span{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;font-family:Fredoka,Nunito,system-ui,sans-serif}
.clue-i.hid{opacity:.4;font-style:italic;animation:pl 1.6s ease-in-out infinite}.clue-i.hid span{background:rgba(255,255,255,.15)}
.potp{font-size:17px}.potp b{color:var(--yel)}
.rnd{display:flex;align-items:center;gap:10px}.prog{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;max-width:180px}.prog i{display:block;height:100%;background:var(--pink);border-radius:99px}
.endb{margin-top:10px;padding:10px;font-size:14px}
.lens{display:flex;gap:8px;flex-wrap:wrap}.len input{display:none}.len span{display:grid;place-items:center;min-width:48px;height:44px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.06);border:2px solid var(--line);font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:18px;cursor:pointer}
.len input:checked+span{background:var(--pink);border-color:var(--pink);color:#fff}
.endh{text-align:center;margin:6px 0 4px}.endh h2{font-size:32px;margin:0}.confetti{font-size:48px;animation:pop .6s ease both}.winner{font-size:18px}.winner b{color:var(--yel)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin:18px 0 6px;min-height:230px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .6s ease both}.pod.p1{animation-delay:.25s}.pod.p0{animation-delay:.5s}.pod.p2{animation-delay:.1s}
.pav{font-size:46px;line-height:1}.pav .avi{width:64px;height:64px;border:3px solid var(--pc)}.pod.p1 .pav .avi{width:78px;height:78px}
.pnm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{width:100%;border-radius:16px 16px 6px 6px;background:linear-gradient(180deg,var(--pc),color-mix(in srgb,var(--pc) 40%,#1a0f33));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;color:#1a0f33}
.pbar span{font-size:26px}.pbar b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:24px}
.scr .tot{min-width:36px;text-align:right;color:var(--mut);font-size:14px}
.acards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 16px}
.acard{display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .45s ease both}
.acard .ain{width:100%;box-sizing:border-box;aspect-ratio:3/4;border-radius:18px;padding:8px;background:linear-gradient(150deg,hsl(var(--h) 70% 72%),hsl(calc(var(--h) + 40) 50% 32%));box-shadow:0 8px 24px -10px hsl(var(--h) 80% 50%);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.acard .ain::before{content:"";position:absolute;inset:6px;border-radius:13px;background:linear-gradient(180deg,rgba(15,8,30,.15),rgba(15,8,30,.85));border:1px solid rgba(255,255,255,.25)}
.amono{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(34px,10vw,64px) Fredoka,Nunito,system-ui,sans-serif;color:rgba(255,255,255,.9);text-shadow:0 4px 18px rgba(0,0,0,.35);padding-bottom:34%}
.aname{position:relative;font:800 clamp(12px,3.4vw,18px)/1.1 Nunito,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em;padding:0 8px 10px;color:#fff;border-bottom:none}
.aname::after{content:"";display:block;width:36%;height:2px;background:#fff;margin-top:6px;border-radius:2px}
.acard{min-width:0}.acard.hid{animation:none}
.acard.hid .ain{background:none;box-shadow:none;border:2px dashed rgba(255,255,255,.22);display:grid;place-items:center;justify-content:center;align-content:center;padding:0}
.acard.hid .ain::before{display:none}
.acard.hid .aq{font:700 48px Fredoka,Nunito,system-ui,sans-serif;color:var(--vio);opacity:.8}
.alab{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.aform{margin-top:20px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.aqlab{font:600 15px ui-monospace,Menlo,monospace;color:var(--mut)}
.anext,.alink{background:none;border:0;color:var(--tx);font:800 13px ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:6px 0}
.alink{color:var(--mut);text-transform:none;letter-spacing:0;font-family:Nunito,system-ui,sans-serif;text-decoration:underline}
.ainput{display:flex;gap:10px}.ainput .txt{flex:1}
.abtn{border:0;padding:0 22px;font:900 16px Nunito,system-ui,sans-serif;text-transform:uppercase;background:var(--tx);color:#1a0f33;cursor:pointer;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);padding-right:30px}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.aok{padding:14px;border-radius:14px;background:color-mix(in srgb,var(--teal) 18%,var(--card));border:1px solid var(--teal);text-align:center;font-size:16px}.aok.pass{background:var(--card);border-color:var(--line)}
.found{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0}.found b{color:var(--yel)}
.yel{color:var(--yel)}.ver{text-align:center;font-size:12px;color:var(--mut);opacity:.6;margin:16px 0 0}
.dixcard{border-radius:26px;padding:24px 20px;margin:10px 0 16px;text-align:center;background:linear-gradient(150deg,#ff8a3d55,#2a1a55 75%);border:1px solid #ff8a3d88;box-shadow:0 10px 30px -12px #ff8a3daa}
.dixcard.f{background:linear-gradient(150deg,#ff4d8d55,#2a1a55 75%);border-color:#ff4d8d88}
.dixwho{font-size:15px;font-weight:800;color:#ffe9f3;opacity:.85;text-transform:uppercase;letter-spacing:.1em}
.dixline{font:700 36px Fredoka,Nunito,system-ui,sans-serif;margin:6px 0 4px}.dixn{color:var(--yel);font-size:52px;vertical-align:-4px}
.dixbut{font:600 24px/1.25 Fredoka,Nunito,system-ui,sans-serif;color:#fff;animation:pop .35s ease both}
.notes{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;margin:8px 0}
@media(max-width:520px){.notes{grid-template-columns:repeat(6,1fr)}}
.note{aspect-ratio:1;border:0;border-radius:14px;background:color-mix(in srgb,var(--nc) 22%,var(--card));border:2px solid color-mix(in srgb,var(--nc) 55%,transparent);color:var(--tx);font:700 20px Fredoka,Nunito,system-ui,sans-serif;cursor:pointer;transition:transform .1s}
.note:hover{transform:translateY(-2px)}.note.on{background:var(--nc);color:#1a0f33;transform:scale(1.1)}.note[disabled]:not(.on){opacity:.35}
.dixavg{text-align:center;margin:8px 0}.dixbig{font:700 56px Fredoka,Nunito,system-ui,sans-serif;color:var(--yel);line-height:1}.dixbig small{font-size:22px;color:var(--mut)}
.dixlist{display:grid;gap:8px;margin:12px 0}.dixrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.05);border-left:4px solid var(--pc)}
.dixrow .av{font-size:22px}.dixrow .pn{width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dixrow b{font:700 20px Fredoka,Nunito,system-ui,sans-serif;width:28px;text-align:right}
.dixbar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.dixbar i{display:block;height:100%;background:var(--pc);border-radius:99px;animation:grow .7s ease both;transform-origin:left}
.dixex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.dixex>span{display:flex;align-items:center;gap:4px}.dixex b{color:var(--yel)}
.msecret{text-align:center;margin:8px 0 12px;padding:18px;border-radius:22px;background:linear-gradient(150deg,#5ad1ff44,#2a1a55 80%);border:1px solid #5ad1ff88}
.mpw{font:700 40px Fredoka,Nunito,system-ui,sans-serif;color:var(--yel);letter-spacing:.04em;margin:4px 0;text-transform:uppercase}
.mclues{display:grid;gap:8px;margin:10px 0 14px}
.mclue{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-height:52px;animation:pop .35s ease both}
.mclue.empty{opacity:.45;animation:none}.mclue.next{opacity:.8;border-style:dashed}
.mpts{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--yel);color:#1a0f33;font:700 16px Fredoka,Nunito,system-ui,sans-serif}
.mclue.empty .mpts{background:rgba(255,255,255,.12);color:var(--mut)}
.mword{font:700 20px Fredoka,Nunito,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.03em;min-width:90px}.mclue.next .mword,.mclue.empty .mword{font-size:15px;text-transform:none;color:var(--mut);letter-spacing:0}
.mtries{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex:1}
.mtry{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;background:color-mix(in srgb,var(--pc) 18%,transparent);border:1px solid color-mix(in srgb,var(--pc) 50%,transparent);font-size:13px;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.4)}
.mtry .avi{width:20px;height:20px}.mtry.ok{background:var(--teal);color:#10213a;text-decoration:none;font-weight:900}
.theme{display:inline-flex;align-items:center;gap:6px;margin:0 0 8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:14px;color:var(--mut)}
.theme b{color:var(--tx)}
.mpat{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 2px;font:700 30px Fredoka,Nunito,system-ui,sans-serif}
.mpat b{color:var(--yel);min-width:22px;text-align:center}.mpat span{color:var(--mut);min-width:22px;text-align:center}.mpat i{font-style:normal;color:var(--mut);min-width:10px}
.ndlad{display:grid;gap:6px;margin:4px 0 10px}
.ndst{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--mut)}
.ndst span{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font:700 13px Fredoka,Nunito,system-ui,sans-serif}
.ndst.done{opacity:.6;text-decoration:line-through}.ndst.cur{color:var(--tx);border-color:#a6ff4d;background:color-mix(in srgb,#a6ff4d 14%,var(--card));font-weight:800}.ndst.cur span{background:#a6ff4d;color:#1a0f33}
.ndst.next{opacity:.45;font-style:italic}
.ndcount{margin-top:10px;font-size:14px;opacity:.85}
.ndrows{display:grid;gap:8px;margin:10px 0}
.ndrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border-left:4px solid var(--pc)}
.ndrow .av{font-size:22px}.ndrow .pn{width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ndrow .ndsaid{flex:1;font:700 17px Fredoka,Nunito,system-ui,sans-serif}
.ndrow.same{background:color-mix(in srgb,var(--pink) 20%,transparent)}.ndrow.ok b{color:var(--teal)}.ndrow.same b{color:var(--pink)}
.ndall{margin:8px 0;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}.ndall summary{cursor:pointer;color:var(--mut);font-weight:800}
.ndall p{line-height:1.7}.ndall .pick{color:var(--yel);font-weight:900}
.center{text-align:center;margin-top:40px}.big{font-size:54px}
#banner{position:fixed;left:50%;bottom:12px;transform:translateX(-50%) translateY(150%);max-width:calc(100% - 24px);width:560px;background:#3a2672;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:700;transition:transform .3s;z-index:40;text-align:center}
#banner.show{transform:translateX(-50%)}#banner.err{background:#6b1838}#banner.info{background:#22305e}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-160%);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;background:var(--yel);color:#1a0f33;padding:10px 18px;border-radius:999px;font-weight:900;z-index:60;transition:transform .25s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast.show{transform:translate(-50%,0);opacity:1}
</style>

const Net={mode:'init',room:null,bc:null,mine:{},others:new Map(),conn:false,tab:rid(8),
 async init(){
  let r=null;
  try{if(window.claude&&typeof window.claude.use==='function')r=await window.claude.use('room')}catch(e){r=null}
  if(r){this.room=r;this.mode='room';
   r.onPeers(()=>onNet(),e=>{this.mode='err';onNet()});
   r.onConnection(c=>{this.conn=c;onNet()},()=>{});
   if(Object.keys(this.mine).length)r.presence(this.mine).catch(()=>{});
   onNet();return}
  // Les téléphones ralentissent les onglets en arrière-plan : on garde un joueur silencieux 25 s avant de le retirer.
  const beat=()=>setInterval(()=>{this.send('p');const now=Date.now();let ch=false;for(const[k,v]of this.others)if(now-v.ts>25000){this.others.delete(k);ch=true}if(ch)onNet()},2000);
  const hooks=()=>{addEventListener('pagehide',e=>{if(!e.persisted)this.send('bye')});
   addEventListener('pageshow',e=>{if(e.persisted)this.send('hello')});
   document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(this.mode==='mqtt'&&this.mq&&!this.mq.connected){try{this.mq.reconnect()}catch(_){}}this.send('hello');onNet()}})};
  if(await this.initMqtt()){beat();hooks();onNet();return}
  try{this.bc=new BroadcastChannel('entre-nous-v1');this.mode='local';this.conn=true;
   this.bc.onmessage=e=>this.onMsg(e.data);
   this.send('hello');beat();hooks();
  }catch(e){this.mode='none'}
  onNet();
 },
 onMsg(m){if(!m||!m.tab||m.tab===this.tab)return;
  if(m.t==='bye')this.others.delete(m.tab);else{this.others.set(m.tab,{p:m.p||{},ts:Date.now()});if(m.t==='hello')this.send('p')}
  onNet()},
 // ---- relais MQTT public (version hébergée hors claude.ai) ----
 mq:null,topic:null,
 async initMqtt(){
  if(!window.mqtt&&window.MQTT_READY){await Promise.race([window.MQTT_READY,new Promise(r=>setTimeout(r,9000))])}
  return new Promise(res=>{
  if(!window.mqtt||typeof window.mqtt.connect!=='function')return res(false);
  const brokers=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];let i=0;
  const tryB=()=>{if(i>=brokers.length)return res(false);const url=brokers[i++];let done=false;
   let c;try{c=window.mqtt.connect(url,{clientId:'en_'+this.tab+'_'+rid(4),reconnectPeriod:2000,connectTimeout:6000,clean:true,keepalive:30})}catch(e){return tryB()}
   const fail=()=>{if(done)return;done=true;try{c.end(true)}catch(e){}tryB()};
   const to=setTimeout(fail,7000);
   c.on('message',(t,buf)=>{if(this.mq!==c)return;try{this.onMsg(JSON.parse(buf.toString()))}catch(e){}});
   c.on('connect',()=>{if(!done){done=true;clearTimeout(to);this.mq=c;this.mode='mqtt';this.conn=true;this.sync(true);res(true)}
    else if(this.mq===c){this.conn=true;this.sync(true);onNet()}});
   c.on('close',()=>{if(this.mq===c){this.conn=false;onNet()}});
   c.on('offline',()=>{if(this.mq===c){this.conn=false;onNet()}});
   c.on('error',()=>{if(!this.mq)fail()});
  };tryB()})},
 // force = (re)connexion : on se réabonne sans oublier les joueurs déjà vus (évite le faux « hôte déconnecté »)
 sync(force){if(this.mode!=='mqtt'||!this.mq)return;const want=this.mine.code?'entrenous-v1/'+this.mine.code:null;
  if(want===this.topic&&!force)return;
  if(this.topic&&this.topic!==want){try{this.mq.publish(this.topic,JSON.stringify({t:'bye',tab:this.tab}));this.mq.unsubscribe(this.topic)}catch(e){}this.others.clear()}
  this.topic=want;
  if(want){this.mq.subscribe(want,{qos:0},()=>this.send('hello'))}
  onNet()},
 send(t){const msg={t,tab:this.tab,p:this.mine};
  if(this.mode==='mqtt'){if(this.mq&&this.topic&&this.mq.connected){try{this.mq.publish(this.topic,JSON.stringify(msg),{qos:0})}catch(e){}}return}
  try{this.bc&&this.bc.postMessage(msg)}catch(e){}},
 set(patch){for(const k in patch){if(patch[k]===null||patch[k]===undefined)delete this.mine[k];else this.mine[k]=patch[k]}
  if(this.mode==='room'){const p={};for(const k in patch){if(k==='img')continue;p[k]=patch[k]===undefined?null:patch[k]}if(Object.keys(p).length)this.room.presence(p).catch(e=>console.warn('presence',e))}
  else if(this.mode==='mqtt'){const want=this.mine.code?'entrenous-v1/'+this.mine.code:null;if(want!==this.topic)this.sync();else this.send('p')}
  else if(this.mode==='local')this.send('p');
  onNet()},
 list(){const out=[{self:true,p:this.mine}];
  if(this.mode==='room'){for(const pe of this.room.peers()){if(pe.isMe&&pe.sameTab)continue;out.push({self:false,p:pe.presence||{}})}}

function pinfo(pid){const g=G();const ps=present();const p=ps.find(x=>x.pid===pid);
 const nm=p?[p.n,p.av]:(g&&g.nm&&g.nm[pid])||['?','❔'];const idx=g?g.pl.indexOf(pid):0;const av=nm[1]||'❔';const img=AVIMG[av]||(p&&validImg(p.img)?p.img:null);
 return{n:nm[0]||'?',av,img,a:img?`<img class="avi" src="${img}" alt="">`:`<span class="ave">${esc(av)}</span>`,c:COLORS[(idx<0?0:idx)%COLORS.length],here:!!p}}
function chip(pid,extra=''){const i=pinfo(pid);return`<span class="chip" style="--pc:${i.c}"><span class="av">${i.a}</span>${esc(i.n)}${extra}</span>`}
function firstName(pid){return pinfo(pid).n}

// ---------- hôte ----------
function newSt(){return{v:1,ep:Date.now(),r:0,g:null,ph:null,pl:[S.me.pid],nm:{},sc:{},n:0,cfg:{},seed:1,i:0,mi:-1}}
function pushSt(){if(!S.host||!S.st)return;const j=JSON.stringify(S.st);if(j===S.lastPushed)return;S.lastPushed=j;Net.set({st:JSON.parse(j)});ls.set('en_host_'+S.code,S.st)}
function hostTick(){
 if(!S.host||!S.st)return;
 // un autre hôte plus récent ? on lui cède la place
 for(const{self,p}of Net.list()){if(self||!p||p.app!==APP||p.code!==S.code||!p.h||!p.st)continue;if((p.st.ep||0)>(S.st.ep||0)){S.host=false;S.st=null;Net.set({h:null,st:null});saveSess();return}}
 const st=S.st,ps=present();
 for(const p of ps){if(!st.pl.includes(p.pid))st.pl.push(p.pid);st.nm[p.pid]=[String(p.n||'').slice(0,18),p.av];if(st.sc[p.pid]==null)st.sc[p.pid]=0}
 if((st.g==='mdp'&&st.ph==='reveal'&&Date.now()-(st.revAt||0)>4000)||(st.g==='nd'&&st.ph==='reveal'&&Date.now()-(st.revAt||0)>(ndDone(st)?7000:5000)))doNext(st);
 if(st.g&&st.ph!=='reveal'&&st.ph!=='end'){
  if(st.ord){for(const p of ps)if(ans(p,st)!==undefined&&!st.ord.includes(p.pid))st.ord.push(p.pid)}
  const el=Date.now()-(st.t0||Date.now());
  if(st.g==='qsj'){const cl=Math.min(2,Math.floor(el/QSJ_STEP));if(cl!==st.cl)st.cl=cl}
  if(st.g==='mdp'){const giver=ps.find(p=>p.pid===st.giver);if(giver&&giver.cl&&giver.cl.k===st.r&&giver.cl.skip){doReveal(st,ps)}else{const gs=ps.filter(p=>p.pid!==st.giver);const n=mdpClues(giver,st).length;
   if(gs.length&&(gs.every(p=>ans(p,st))||(n>=5&&gs.every(p=>ans(p,st)||mdpTries(p,st).length>=5))))doReveal(st,ps)}}
  if(st.g==='anim'){const cl=Math.min(2,Math.floor(el/AN_STEP));if(cl>(st.cl|0))st.cl=cl}
  const ex=expected(st,ps);
  if((ex&&ex.length&&ex.every(p=>ans(p,st)!==undefined))||((st.g==='quiz'||st.g==='vf')&&el>QTIME+1500)||(st.g==='qsj'&&el>QSJ_MAX)||(st.g==='nd'&&el>ND_TIME+1500)||(st.g==='anim'&&el>AN_MAX))doReveal(st,ps)}
 pushSt();
}
function expected(g,ps){
 switch(g.g){
  case'roue':{const med=ps.find(p=>p.pid===g.med);if(!med||!ans(med,g))return null;return ps.filter(p=>p.pid!==g.med)}
  case'qdn':return ps.filter(p=>g.cfg.cp.includes(p.pid)).length===2?ps.filter(p=>g.cfg.cp.includes(p.pid)):null;
  case'duo':return ps.some(p=>p.pid===g.sub)&&ps.length>1?ps:null;
  case'tp':case'plus':case'quiz':case'vf':case'qsj':case'dix':return ps;
  case'nd':return ps.filter(p=>(g.alive||[]).includes(p.pid));
  case'imp':return g.ph==='vote'?ps:null;
 }return null}
function pick(st,list){const d=shuffled(list,st.seed);return d[st.i%d.length]}
function setupRound(st){
 const ps=present();const order=ps.map(p=>p.pid);
 st.r++;st.i++;st.n++;st.ph='play';st.last=null;
 const F=flat(st.g);let pool=range(F.length).filter(i=>(st.cfg.cats||[]).includes(F[i].c));if(!pool.length)pool=range(F.length);
 switch(st.g){
  case'roue':st.mi=(st.mi+1)%Math.max(1,order.length);st.med=order[st.mi];st.q=pick(st,pool);st.t=Math.round(12+Math.random()*156);break;
  case'qdn':case'tp':case'plus':st.q=pick(st,pool);break;
  case'nd':{const F=flat('nd');const cont=st.si!=null&&F[st.q]&&!ndDone(st)&&(st.alive||[]).some(pid=>order.includes(pid));
   if(cont){st.si++;st.n--;st.alive=st.alive.filter(pid=>order.includes(pid))}else{st.q=pick(st,pool);st.si=0;st.alive=order.slice()}
   const step=F[st.q].v[st.si];st.sp=Math.floor(Math.random()*step[1].length);st.t0=Date.now();st.res=null;break}
  case'mdp':{const go=st.gorder&&st.gorder.length?st.gorder:order;const wpp=st.cfg.wpp||10;
   if(st.wi==null||st.wi>=wpp-1||!order.includes(st.giver)){st.mi=(st.mi|0)+(st.wi==null?1:1);if(st.wi==null)st.mi=0;st.wi=0;
    // indicateur suivant encore présent
    let k=0;while(k<go.length&&!order.includes(go[st.mi%go.length])){st.mi++;k++}}else st.wi++;
   st.giver=go[st.mi%go.length];st.q=pick(st,pool);break}
  case'dix':st.q=pick(st,pool);st.gd=Math.random()<.5?'m':'f';st.bn=[7,8,9,10,10,10,10][Math.floor(Math.random()*7)];break;
  case'duo':st.mi=(st.mi+1)%Math.max(1,order.length);st.sub=order[st.mi];st.q=pick(st,pool);break;
  case'quiz':st.q=pick(st,pool);st.op=shuffled([0,1,2,3],Math.floor(Math.random()*1e9));st.ord=[];st.t0=Date.now();break;
  case'vf':st.q=pick(st,pool);st.ord=[];st.t0=Date.now();break;
  case'anim':st.q=pick(st,pool);st.cl=0;st.t0=Date.now();break;
  case'qsj':{st.q=pick(st,pool);const F=flat('qsj'),c=F[st.q].c;const others=shuffled(range(F.length).filter(i=>i!==st.q&&F[i].c===c),Math.floor(Math.random()*1e9)).slice(0,3);
   st.op=shuffled([st.q,...others],Math.floor(Math.random()*1e9));st.cl=0;st.t0=Date.now();break}
  case'imp':st.ph='words';st.imp=order[Math.floor(Math.random()*order.length)];st.q=pick(st,pool);st.sw=Math.random()<.5?0:1;st.first=order[Math.floor(Math.random()*order.length)];break;
 }
}
function addPts(st,last){st.last=last;st.gs=st.gs||{};for(const k in last){st.sc[k]=(st.sc[k]||0)+last[k];st.gs[k]=(st.gs[k]||0)+last[k]}}
function zonePts(d){d=Math.abs(d);return d<=4?4:d<=11?3:d<=18?2:0}
function doReveal(st,ps){
 ps=ps||present();const last={};
 switch(st.g){
  case'roue':{let sum=0,n=0;for(const p of ps){if(p.pid===st.med)continue;const v=ans(p,st);if(typeof v!=='number')continue;const pts=zonePts(v-st.t);last[p.pid]=pts;sum+=pts;n++}
   if(n)last[st.med]=Math.round(sum/n);break}
  case'qdn':{const [a,b]=st.cfg.cp;const pa=ps.find(p=>p.pid===a),pb=ps.find(p=>p.pid===b);const va=ans(pa,st),vb=ans(pb,st);
   if(va&&vb){st.qn=(st.qn||0)+1;if(va===vb){st.m=(st.m||0)+1;last[a]=1;last[b]=1;for(const p of ps){if(st.cfg.cp.includes(p.pid))continue;if(ans(p,st)===va)last[p.pid]=1}}}break}
  case'tp':{let A=0,B=0;ps.forEach(p=>{const v=ans(p,st);if(v==='a')A++;if(v==='b')B++});if(A!==B){const w=A>B?'a':'b';ps.forEach(p=>{if(ans(p,st)===w)last[p.pid]=1})}break}
  case'plus':{const t={};ps.forEach(p=>{const v=ans(p,st);if(v)t[v]=(t[v]||0)+1});const mx=Math.max(0,...Object.values(t));const win=Object.keys(t).filter(k=>t[k]===mx);
   st.win=win;ps.forEach(p=>{if(win.includes(ans(p,st)))last[p.pid]=1});break}
  case'quiz':case'vf':{const it=flat(st.g)[st.q].v;const ok=v=>st.g==='quiz'?v===0:(v==='v')===it[1];let first=null;
   for(const pid of (st.ord||[])){const p=ps.find(x=>x.pid===pid);if(p&&ok(ans(p,st))){first=pid;break}}
   ps.forEach(p=>{if(ok(ans(p,st)))last[p.pid]=2+(p.pid===first?1:0)});st.first=first;break}
  case'qsj':ps.forEach(p=>{const v=ans(p,st);if(v&&v.o===st.q)last[p.pid]=Math.max(1,3-(v.l|0))});break;
  case'nd':{const ch=flat('nd')[st.q].v;const res={};const alive=st.alive||[];
   ps.forEach(p=>{if(!alive.includes(p.pid))return;const v=ans(p,st);if(!v||typeof v.o!=='number')res[p.pid]='none';else if(v.o===st.sp)res[p.pid]='same';else{res[p.pid]='ok';last[p.pid]=1}});
   st.alive=alive.filter(pid=>res[pid]==='ok');if(st.si>=ch.length-1)st.alive.forEach(pid=>last[pid]=(last[pid]||0)+2);st.res=res;break}
  case'mdp':{let best=0;ps.forEach(p=>{if(p.pid===st.giver)return;const v=ans(p,st);if(v&&v.n){const pts=Math.max(1,6-v.n);last[p.pid]=pts;best=Math.max(best,pts)}});if(best)last[st.giver]=best;break}
  case'dix':{const vs=ps.map(p=>({pid:p.pid,v:ans(p,st)})).filter(x=>typeof x.v==='number');if(vs.length>1){const avg=vs.reduce((a,x)=>a+x.v,0)/vs.length;
   const d=Math.min(...vs.map(x=>Math.abs(x.v-avg)));vs.forEach(x=>{if(Math.abs(Math.abs(x.v-avg)-d)<1e-9)last[x.pid]=1})}break}
  case'anim':ps.forEach(p=>{const v=ans(p,st);if(v&&v.ok)last[p.pid]=Math.max(1,3-(v.l|0))});break;
  case'imp':{const t={};ps.forEach(p=>{const v=ans(p,st);if(v)t[v]=(t[v]||0)+1});const mx=Math.max(0,...Object.values(t));const top=Object.keys(t).filter(k=>t[k]===mx);
   st.out=top.length===1?top[0]:null;st.caught=st.out===st.imp;
   if(st.caught)ps.forEach(p=>{if(p.pid!==st.imp)last[p.pid]=1});else last[st.imp]=2;break}
 }
 if(st.g!=='duo')addPts(st,last);
 st.ph='reveal';st.revAt=Date.now();
}
// « Même réponse » : les points sont validés par la cible, on les compte en quittant la manche
function settleDuo(st){if(st.g==='duo'&&st.ph==='reveal'&&st.ddone!==st.r){const subP=present().find(p=>p.pid===st.sub);const ok=subP&&subP.ok&&subP.ok.k===st.r?subP.ok.l:[];const last={};
  ok.forEach(pid=>{last[pid]=(last[pid]||0)+1;last[st.sub]=(last[st.sub]||0)+1});addPts(st,last);st.ddone=st.r}}
const ND_TIME=30000;
function ndDone(g){const F=flat('nd');const ch=F[g.q]&&F[g.q].v;return g.si==null||!ch||g.si>=ch.length-1||!(g.alive||[]).length}
function isLast(g){if(g.g==='nd')return ndDone(g)&&!!(g.cfg.len&&g.n>=g.cfg.len);if(g.g==='mdp')return(g.wi|0)>=(g.cfg.wpp||10)-1&&(g.mi|0)>=(g.gorder||[]).length-1;return!!(g.cfg.len&&g.n>=g.cfg.len)}
function doNext(st){settleDuo(st);if(isLast(st))return doFinish(st);setupRound(st)}
function doFinish(st){settleDuo(st);st.ph='end';st.last=null}
function startGame(st,k,cfg){st.g=k;st.cfg=cfg;st.seed=Math.floor(Math.random()*1e9);st.i=-1;st.n=0;st.m=0;st.qn=0;st.mi=-1;st.wi=null;st.si=null;st.alive=null;st.gs={};st.ddone=null;
 if(k==='mdp'){st.gorder=present().map(p=>p.pid);cfg.len=0}setupRound(st)}
function hostDo(fn){if(!S.host||!S.st)return;fn(S.st);pushSt();onNet()}

 S.code=code;S.host=asHost;S.joinedAt=Date.now();S.modal=null;

 S.lastPushed='';pushSt();saveSess();

function L(id,fn){S.lives.push({id,fn,last:null});return`<div id="${id}">${fn()}</div>`}
function screen(){if(!S.code)return'home';const g=G();if(!g)return'wait';return g.g?'game':'lobby'}
function sigOf(){const sc=screen();const g=G();const ps=present();const parts=[sc,Net.mode,S.modal&&JSON.stringify(S.modal),S.host,ps.map(p=>p.pid+p.n+p.av+(p.img?p.img.length:0)).join(',')];
 if(sc==='wait')parts.push(!!S.lastSt,Date.now()-S.joinedAt>6000);
 if(g&&g.g){parts.push(g.g,g.ph,g.r,JSON.stringify(myAns()),S.showWord);
  if(g.g==='roue'){const m=ps.find(p=>p.pid===g.med);parts.push(!!ans(m,g))}
  if(g.g==='qsj'||g.g==='anim')parts.push(g.cl);
  if(g.g==='nd')parts.push(g.si,JSON.stringify(g.alive));
  if(g.g==='mdp'){const gv=ps.find(p=>p.pid===g.giver);parts.push(mdpClues(gv,g).length,mdpTries(Object.assign({},Net.mine),g).length)}
  if(g.ph==='reveal')parts.push(ps.map(p=>JSON.stringify(ans(p,g))).join('|'));
 }
 if(sc==='lobby')parts.push(JSON.stringify(g.cfg));
 return parts.join('§')}
function tick(){
 hostTick();
 if(!S.host){const h=hostPeer();if(h){S.lastSt=h.st;S.hostSeen=Date.now()}}

function render(){
 const keep={};document.querySelectorAll('input[id],textarea[id],select[id]').forEach(el=>{keep[el.id]=el.type==='checkbox'?el.checked:el.value});
 const act=document.activeElement&&document.activeElement.id;
 S.lives=[];S.after=[];
 const sc=screen();let h='';
 if(sc==='home')h=vHome();else if(sc==='wait')h=vWait();else if(sc==='lobby')h=vLobby();else h=vGame();
 if(S.modal)h+=vModal();
 $('#app').innerHTML=h;
 for(const id in keep){const el=document.getElementById(id);if(el){if(el.type==='checkbox')el.checked=keep[id];else el.value=keep[id]}}
 for(const l of S.lives)l.last=document.getElementById(l.id)?.innerHTML;
 if(act){const el=document.getElementById(act);if(el&&el.focus)el.focus()}
 S.after.forEach(f=>f());
}

function hostCtl(){const g=G();if(g.ph==='end')return'';if(!S.host)return`<div class="hctl mut">${g.ph==='reveal'?'L\'hôte lance la suite…':''}</div>`;
 if(g.g==='imp'&&g.ph==='words')return`<div class="hctl"><button class="btn pink block" data-act="tovote">Passer au vote 🗳️</button></div>`;

function lastPts(){const g=G();if(!g.last)return'';const ks=Object.keys(g.last).filter(k=>g.last[k]>0);if(!ks.length)return'<p class="mut c">Personne ne marque cette manche.</p>';

// ----- la demi-roue -----
const CX=200,CY=205,R=185;
function pt(a,r){const t=a*Math.PI/180;return[CX-r*Math.cos(t),CY-r*Math.sin(t)]}
function wedge(a1,a2,r,fill){a1=Math.max(0,a1);a2=Math.min(180,a2);if(a2<=a1)return'';const[x1,y1]=pt(a1,r),[x2,y2]=pt(a2,r);return`<path d="M${CX} ${CY}L${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}Z" fill="${fill}"/>`}
function wheel(o){const sp=o.sp;let z='';
 if(o.t!=null){const t=o.t;z+=wedge(t-18,t-11,R,'#ffd23f')+wedge(t-11,t-4,R,'#ff8a3d')+wedge(t-4,t+4,R,'#ff4d8d')+wedge(t+4,t+11,R,'#ff8a3d')+wedge(t+11,t+18,R,'#ffd23f');
  [[t-14.5,'2'],[t-7.5,'3'],[t,'4'],[t+7.5,'3'],[t+14.5,'2']].forEach(([a,l])=>{if(a<1||a>179)return;const[x,y]=pt(a,R-22);z+=`<text x="${x}" y="${y+6}" class="zl">${l}</text>`})}
 let nd='';(o.needles||[]).forEach(n=>{const[x,y]=pt(n.a,R-8);const[lx,ly]=pt(n.a,R-40);nd+=`<line x1="${CX}" y1="${CY}" x2="${x}" y2="${y}" stroke="${n.c}" stroke-width="5" stroke-linecap="round" opacity=".95"/>${n.img?`<clipPath id="cp${Math.round(n.a*10)}"><circle cx="${lx}" cy="${ly}" r="13"/></clipPath><image href="${n.img}" x="${lx-13}" y="${ly-13}" width="26" height="26" clip-path="url(#cp${Math.round(n.a*10)})"/><circle cx="${lx}" cy="${ly}" r="13" fill="none" stroke="${n.c}" stroke-width="2.5"/>`:`<text x="${lx}" y="${ly+7}" class="nl">${esc(n.l)}</text>`}`});
 let it='';if(o.inter){const[x,y]=pt(S.needle,R-8);it=`<line id="needle" x1="${CX}" y1="${CY}" x2="${x}" y2="${y}" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle id="knob" cx="${x}" cy="${y}" r="13" fill="#fff" stroke="#1a0f33" stroke-width="3"/>`}
 return`<div class="wheelwrap"><svg id="${o.inter?'wheel':'wheelro'}" viewBox="0 0 400 215" class="wheel ${o.inter?'inter':''}">
  <defs><linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#3d6bff"/><stop offset=".5" stop-color="#7a4bd1"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient></defs>
  ${wedge(0,180,R,'url(#wg)')}${wedge(0,180,R-1,'rgba(20,10,40,.35)')}${z}${nd}${it}<circle cx="${CX}" cy="${CY}" r="16" fill="#1a0f33" stroke="#fff" stroke-width="3"/></svg>
  <div class="ends"><span class="e1">⟵ ${esc(sp[0])}</span><span class="e2">${esc(sp[1])} ⟶</span></div></div>`}
function bindWheel(){const svg=document.getElementById('wheel');if(!svg)return;let drag=false;
 const upd=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());let th=Math.atan2(CY-q.y,q.x-CX)*180/Math.PI;if(th<0)th=q.x<CX?180:0;let a=180-th;a=Math.max(0,Math.min(180,a));S.needle=Math.round(a*10)/10;
  const[x,y]=pt(S.needle,R-8);const n=document.getElementById('needle'),k=document.getElementById('knob');n.setAttribute('x2',x);n.setAttribute('y2',y);k.setAttribute('cx',x);k.setAttribute('cy',y)};
 svg.addEventListener('pointerdown',e=>{drag=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}upd(e);e.preventDefault()});
 svg.addEventListener('pointermove',e=>{if(drag)upd(e)});
 svg.addEventListener('pointerup',()=>drag=false);svg.addEventListener('pointercancel',()=>drag=false)}
function vRoue(g){const ps=present();const isMed=S.me.pid===g.med;const medP=ps.find(p=>p.pid===g.med);const ma=ans(medP,g);const clue=ma&&ma.c;const mine=myAns();
 const guessers=()=>present().filter(p=>p.pid!==g.med);
 const head=`<div class="role">🔮 Médium : ${chip(g.med)}</div>`;
 if(g.ph==='reveal'){const needles=ps.filter(p=>p.pid!==g.med&&typeof ans(p,g)==='number').map(p=>{const i=pinfo(p.pid);return{a:ans(p,g),c:i.c,l:i.av,img:i.img}});
  return`${head}<div class="clue">« ${esc(clue||'—')} »</div>${wheel({sp:item(g).v,t:g.t,needles})}${lastPts()}`}
 if(isMed){if(!clue){S.after.push(()=>{const i=document.getElementById('clue');i&&i.focus()});
   return`${head}<div class="card hint">C'est toi le médium ! La cible est cachée ici. Donne <b>un indice</b> pour que les autres la trouvent.</div>${wheel({sp:item(g).v,t:g.t})}
   <div class="row"><input id="clue" class="txt" maxlength="40" placeholder="Ton indice…" autocomplete="off"><button class="btn pink" data-act="sendclue">Envoyer</button></div>`}
  return`${head}<div class="clue">« ${esc(clue)} »</div>${wheel({sp:item(g).v,t:g.t})}<p class="mut c">Les autres cherchent la cible…</p>${L('stat',()=>statusHTML(guessers()))}`}
 if(!clue)return`${head}${wheel({sp:item(g).v})}<div class="card c pulse">🔮 ${esc(firstName(g.med))} réfléchit à un indice…</div>`;
 if(typeof mine==='number')return`${head}<div class="clue">« ${esc(clue)} »</div>${wheel({sp:item(g).v,needles:[{a:mine,c:pinfo(S.me.pid).c,l:S.me.av,img:pinfo(S.me.pid).img}]})}<p class="mut c">Aiguille verrouillée ✓ En attente des autres…</p>${L('stat',()=>statusHTML(guessers()))}`;
 S.after.push(bindWheel);
 return`${head}<div class="clue">« ${esc(clue)} »</div>${wheel({sp:item(g).v,inter:true})}<p class="mut c">Fais glisser l'aiguille, puis valide.</p><button class="btn pink block" data-act="lockneedle">Valider ma réponse</button>${L('stat',()=>statusHTML(guessers()))}`}

function vQdn(g){const cp=g.cfg.cp||[];const inC=cp.includes(S.me.pid);const other=cp.find(p=>p!==S.me.pid);const it=item(g);const q={q:it.v,c:it.c};const mine=myAns();const ps=present();
 const score=`<div class="agree">Accord : <b>${g.m||0}</b> / ${g.qn||0}${g.qn?` · ${Math.round(100*(g.m||0)/g.qn)}%`:''}</div>`;
 const qcard=`<div class="qcard" style="--gc:${GAMES.qdn.c}"><div class="qpre">Qui de nous deux…</div><div class="qtxt">${esc(q.q)}</div></div>`;
 if(cp.length<2)return`<div class="card">Il faut 2 joueurs pour ce jeu.</div>`;
 if(g.ph==='reveal'){const pa=ps.find(p=>p.pid===cp[0]),pb=ps.find(p=>p.pid===cp[1]);const va=ans(pa,g),vb=ans(pb,g);const same=va&&va===vb;
  const who=(v,self)=>v?(v===self?'Moi !':esc(firstName(v))):'—';
  const bets=ps.filter(p=>!cp.includes(p.pid)&&ans(p,g));
  return`${score}${qcard}<div class="rev2">
   <div class="rv" style="--pc:${pinfo(cp[0]).c}"><div class="rvn">${pinfo(cp[0]).a} ${esc(firstName(cp[0]))}</div><div class="rva">${who(va,cp[0])}</div><div class="rvs">désigne ${va?pinfo(va).a+' '+esc(firstName(va)):'—'}</div></div>
   <div class="rv" style="--pc:${pinfo(cp[1]).c}"><div class="rvn">${pinfo(cp[1]).a} ${esc(firstName(cp[1]))}</div><div class="rva">${who(vb,cp[1])}</div><div class="rvs">désigne ${vb?pinfo(vb).a+' '+esc(firstName(vb)):'—'}</div></div></div>
   <div class="verdict ${same?'yes':'no'}">${same?`💚 Même réponse : ${esc(firstName(va))} !`:va&&vb?'💥 Pas d\'accord !':'Réponse manquante'}</div>
   ${bets.length?`<div class="bets"><span class="mut">Paris :</span> ${bets.map(p=>chip(p.pid,` → ${esc(firstName(ans(p,g)))}`)).join('')}</div>`:''}`}
 const stat=L('stat',()=>statusHTML(present().filter(p=>cp.includes(p.pid))));
 if(inC){return`${score}${qcard}<div class="choice2">
   <button class="big2 ${mine===S.me.pid?'on':''}" data-act="ans" data-v="${S.me.pid}" style="--pc:${pinfo(S.me.pid).c}"><span>${pinfo(S.me.pid).a}</span>Moi</button>
   <button class="big2 ${mine===other?'on':''}" data-act="ans" data-v="${other}" style="--pc:${pinfo(other).c}"><span>${pinfo(other).a}</span>${esc(firstName(other))}</button></div>
   ${mine?'<p class="mut c">Réponse enregistrée. On attend l\'autre…</p>':''}${stat}`}
 return`${score}${qcard}<p class="mut c">Tu es spectateur. Ton pari :</p><div class="choice2">${cp.map(pid=>`<button class="big2 ${mine===pid?'on':''}" data-act="ans" data-v="${pid}" style="--pc:${pinfo(pid).c}"><span>${pinfo(pid).a}</span>${esc(firstName(pid))}</button>`).join('')}</div>${stat}`}

 const qc=`<div class="qcard" style="--gc:${GAMES.vf.c}"><div class="qtxt">${esc(q[0])}</div></div>`;

   return`<div class="scr ${p.here?'':'gone'}" style="--pc:${p.c}"><span class="rk">${gs[pid]?(MED[r]||r+1):'–'}</span><span class="av">${p.a}</span><span class="pn">${esc(p.n)}</span><b>${gs[pid]||0}</b><span class="tot">${g.sc[pid]||0}</span></div>`}).join('')}</div></div>
  ${S.host?`<div class="row"><button class="btn ghost grow" data-act="tolobby">Changer de jeu</button><button class="btn pink grow" data-act="replay">Rejouer 🔁</button></div>`:'<p class="mut c">L\'hôte choisit la suite…</p>'}`}

// ----- devine l'anime -----
function initials(n){return n.replace(/[^\p{L}\p{N} .-]/gu,'').split(/[\s.-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function hueOf(n){let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%360;return h}
function charCard(name,i,shown){if(!shown)return`<div class="acard hid"><div class="ain"><div class="aq">?</div></div><div class="alab">Indice ${i+1}</div></div>`;
 const h=hueOf(name);return`<div class="acard" style="--h:${h}"><div class="ain"><div class="amono">${esc(initials(name))}</div><div class="aname">${esc(name)}</div></div><div class="alab">Indice ${i+1}</div></div>`}
function vAnim(g){const it=item(g);const [names,chars]=it.v;const mine=myAns();const ps=present();const cl=g.ph==='reveal'?2:(g.cl|0);
 const cards=`<div class="acards">${chars.map((c,i)=>charCard(c,i,i<=cl)).join('')}</div>`;
 if(g.ph==='reveal'){const found=ps.filter(p=>{const v=ans(p,g);return v&&v.ok}).sort((a,b)=>(ans(a,g).l|0)-(ans(b,g).l|0));
  return`${cards}<div class="truth"><div class="lbl">C'était</div><div class="tv">${esc(names[0])}</div></div>
  ${found.length?`<div class="found">${found.map(p=>chip(p.pid,` <b>perso ${(ans(p,g).l|0)+1}</b>`)).join('')}</div>`:'<p class="mut c">Personne n\'a trouvé !</p>'}${lastPts()}`}
 const pts=3-cl;const done=mine!==undefined;
 S.after.push(()=>{const i=document.getElementById('aguess');if(i&&!done)i.focus()});
 return`${cards}<div class="aform">
  <div class="arow"><span class="aqlab">Quel anime ?</span>${S.host&&cl<2?'<button class="anext" data-act="nextclue">Indice suivant ⟶</button>':''}</div>
  ${done?(mine.ok?`<div class="aok">✅ Trouvé : <b>${esc(names[0])}</b> — ${3-(mine.l|0)} pt${3-(mine.l|0)>1?'s':''}</div>`:'<div class="aok pass">Tu as passé ton tour.</div>')
   :`<div class="ainput"><input id="aguess" class="txt" placeholder="Nom de l'anime…" autocomplete="off" maxlength="60"><button class="abtn" data-act="guessanim">Répondre</button></div>
   <div class="arow"><span class="mut">Trouve maintenant : <b class="yel">${pts} pt${pts>1?'s':''}</b></span><button class="alink" data-act="passanim">Je passe</button></div>`}
 </div>${L('stat',()=>statusHTML(present()))}`}

// ----- ne dis pas la même chose que moi -----
function ndMatch(txt,opts){const g=normT(txt);if(g.length<1)return -1;let best=-1,bd=99;
 opts.forEach((o,i)=>o.split('|').forEach(a=>{const n=normT(a);if(!n)return;let d=n===g?0:lev(g,n);const tol=n.length>=9?2:n.length>=5?1:0;if(d<=tol&&d<bd){bd=d;best=i}}));return best}
function vNd(g){const it=item(g);const ch=it.v;const si=g.si|0;const step=ch[si];const ps=present();const me=S.me.pid;const alive=(g.alive||[]).includes(me);const mine=myAns();
 const name=i=>step[1][i].split('|')[0];
 const ladder=`<div class="ndlad">${ch.map((s,i)=>`<div class="ndst ${i<si?'done':i===si?'cur':'next'}"><span>${i+1}</span>${i<=si?esc(s[0]):'Thème plus précis…'}</div>`).join('')}</div>`;
 if(g.ph==='reveal'){const res=g.res||{};const ids=Object.keys(res);const over=ndDone(g);
  const rows=ids.map(pid=>{const v=ans(ps.find(p=>p.pid===pid),g);const r=res[pid];const said=v&&typeof v.o==='number'?name(v.o):'—';
   return`<div class="ndrow ${r}" style="--pc:${pinfo(pid).c}"><span class="av">${pinfo(pid).a}</span><span class="pn">${esc(pinfo(pid).n)}</span><span class="ndsaid">${esc(said)}</span><b>${r==='ok'?'✅':r==='same'?'💀 Pareil !':'⏳ Rien dit'}</b></div>`}).join('');
  return`${ladder}<div class="truth"><div class="lbl">Le site disait</div><div class="tv">${esc(name(g.sp))}</div></div><div class="ndrows">${rows}</div>
   <details class="ndall"><summary>Les ${step[1].length} réponses possibles</summary><p>${step[1].map((o,i)=>`<span class="${i===g.sp?'pick':''}">${esc(o.split('|')[0])}</span>`).join(' · ')}</p></details>
   ${over?(g.alive||[]).length?`<p class="c">🏆 Survivants de la chaîne : ${(g.alive||[]).map(pid=>chip(pid)).join('')}</p>`:'<p class="mut c">Tout le monde est tombé ! Chaîne terminée.</p>':`<p class="mut c">Étape suivante dans quelques secondes…</p>`}${lastPts()}`}
 const card=`<div class="qcard" style="--gc:${GAMES.nd.c}"><div class="qpre">Cite…</div><div class="qtxt">${esc(step[0])}</div><div class="ndcount">${step[1].length} réponses possibles · ne dis pas la même chose que moi !</div></div>`;
 const stat=L('stat',()=>statusHTML(present().filter(p=>(G().alive||[]).includes(p.pid))));
 if(!alive)return`${ladder}${card}<div class="card c">💀 Tu es éliminé de cette chaîne. Regarde les autres trembler !</div>${stat}`;
 if(mine)return`${ladder}${card}${timerBar(g,ND_TIME)}<div class="aok">Tu as dit : <b>${esc(name(mine.o))}</b> 🤞</div>${stat}`;
 S.after.push(()=>{const i=document.getElementById('ndans');i&&i.focus()});
 return`${ladder}${card}${timerBar(g,ND_TIME)}<div class="row"><input id="ndans" class="txt" maxlength="40" placeholder="Ta réponse…" autocomplete="off"><button class="btn pink" data-act="ndsend">Valider</button></div>${stat}`}

// ----- mot de passe -----
function mdpClues(p,g){return p&&p.cl&&p.cl.k===g.r&&Array.isArray(p.cl.l)?p.cl.l.slice(0,5).map(x=>String(x).slice(0,30)):[]}
function mdpTries(p,g){return p&&p.gs&&p.gs.k===g.r&&Array.isArray(p.gs.l)?p.gs.l.slice(0,5).map(x=>String(x).slice(0,30)):[]}
function stemW(x){let n=normT(x);if(n.length>4)n=n.replace(/(s|x)$/,'');return n}
function sameWord(a,b){const x=stemW(a),y=stemW(b);if(!x||!y)return false;if(x===y)return true;return y.length>=6&&lev(x,y)<=1}
function vMdp(g){const word=item(g).v;const ps=present();const me=S.me.pid;const isG=me===g.giver;const giver=ps.find(p=>p.pid===g.giver);const clues=mdpClues(giver,g);
 const guessers=ps.filter(p=>p.pid!==g.giver);
 const feed=()=>{const ps2=present();const gv=ps2.find(p=>p.pid===g.giver);const cl=mdpClues(gv,g);const gs=ps2.filter(p=>p.pid!==g.giver);
  return`<div class="mclues">${[0,1,2,3,4].map(i=>{const c=cl[i];const tries=gs.map(p=>{let t=mdpTries(p,g)[i];if(t==='—')t='';const v=ans(p,g);const ok=v&&v.n===i+1;const show=!ok||isG||g.ph==='reveal';return t||ok?`<span class="mtry ${ok?'ok':''}" style="--pc:${pinfo(p.pid).c}">${pinfo(p.pid).a}${show?esc(t||''):''}${ok?' ✓':''}</span>`:''}).join('');
   return`<div class="mclue ${c?'':'empty'} ${i===cl.length&&g.ph!=='reveal'?'next':''}"><span class="mpts">${5-i}</span><span class="mword">${c?esc(c):i===cl.length&&g.ph!=='reveal'?'Indice en attente…':'—'}</span><span class="mtries">${tries}</span></div>`}).join('')}</div>`};
 const head=`<div class="role">🔑 ${chip(g.giver)} fait deviner sa série</div>`;
 const pattern=`<div class="mpat">${[...word].map((ch,i)=>i===0?`<b>${esc(ch.toUpperCase())}</b>`:/[\s'’-]/.test(ch)?`<i>${esc(ch===' '?'\u00a0':ch)}</i>`:'<span>_</span>').join('')}</div><div class="mut c">${[...word].filter(c=>/\p{L}/u.test(c)).length} lettres</div>`;
 if(g.ph==='reveal'){const sk=giver&&giver.cl&&giver.cl.k===g.r&&giver.cl.skip;return`${head}<div class="truth"><div class="lbl">${sk?'Mot passé ! C\'était':'Le mot de passe était'}</div><div class="tv">${esc(word)}</div></div>${feed()}${lastPts()}<p class="mut c">Mot suivant dans quelques secondes…</p>`}
 if(isG){const done=clues.length>=5;S.after.push(()=>{const i=document.getElementById('mclue');i&&i.focus()});
  return`${head}<div class="msecret"><div class="lbl">Ton mot de passe</div><div class="mpw">${esc(word)}</div><div class="mut">Fais-le deviner avec <b>un seul mot</b> à chaque indice.</div></div>
  ${done?'<p class="mut c">Tu as donné tes 5 indices. On attend les dernières réponses…</p>':`<div class="row"><input id="mclue" class="txt" maxlength="30" placeholder="Indice n°${clues.length+1} (un seul mot)" autocomplete="off"><button class="btn pink" data-act="mdpclue">Donner</button></div>`}
  <div class="c"><button class="alink" data-act="mdpskip">Passer ce mot ⟶</button></div>
  <p class="mut c">Les autres voient la 1re lettre : <b>${esc(word[0].toUpperCase())}</b></p>
  ${L('mfeed',feed)}`}
 const mine=myAns();const tries=mdpTries(Object.assign({},Net.mine),g);const canTry=!mine&&clues.length>0&&tries.length<clues.length;
 if(canTry)S.after.push(()=>{const i=document.getElementById('mguess');i&&i.focus()});
 return`${head}${pattern}${L('mfeed',feed)}
  ${mine?`<div class="aok">✅ Trouvé : <b>${esc(word)}</b> — ${Math.max(1,6-mine.n)} pts</div>`
  :!clues.length?`<div class="card c pulse">🔑 ${esc(firstName(g.giver))} prépare son premier indice…</div>`
  :canTry?`<div class="row"><input id="mguess" class="txt" maxlength="30" placeholder="Ta réponse (${Math.max(1,6-clues.length)} pts)" autocomplete="off"><button class="btn teal" data-act="mdpguess">Proposer</button></div>`
  :tries.length>=5?'<p class="mut c">Plus d\'essais pour cette manche 😢</p>':'<p class="mut c">Raté ! Attends l\'indice suivant…</p>'}`}

function vDix(g){const it=item(g);const m=g.gd!=='f';const flaw=it.v.replace(/\{P\}/g,m?'il':'elle');const mine=myAns();const ps=present();
 const card=`<div class="dixcard ${m?'m':'f'}"><div class="dixwho">${m?'🧔 Un mec':'👩 Une meuf'}</div>
  <div class="dixline">C'est ${m?'un':'une'} <span class="dixn">${g.bn}</span></div><div class="dixbut">${esc(flaw)}…</div></div>`;

 return`${card}<div class="lbl c">Ta nouvelle note</div><div class="notes">${range(11).map(n=>`<button class="note ${mine===n?'on':''}" style="--nc:hsl(${n*12} 85% 60%)" data-act="ansn" data-v="${n}" ${mine!==undefined?'disabled':''}>${n}</button>`).join('')}</div>
  ${mine!==undefined?`<p class="mut c">Note verrouillée : <b>${mine}/10</b> 🔒</p>`:''}${L('stat',()=>statusHTML(present()))}`}

  if(m.g==='imp')opts+=`<div class="lbl">Mode</div><select id="impmode" class="txt"><option value="mot">Undercover : l'imposteur a un mot proche (et ne sait pas qu'il l'est)</option><option value="blanc">Mister White : l'imposteur n'a aucun mot</option></select>`;
  h=`<h2>${x.e} ${esc(x.n)}</h2><p>${x.r}</p>${opts}${enough?'':`<p class="warn">Il faut au moins ${x.min} joueurs connectés (${ps.length} actuellement).</p>`}
  <div class="row"><button class="btn ghost" data-act="close">Annuler</button><button class="btn pink grow" data-act="start" data-g="${m.g}" ${enough?'':'disabled'}>Lancer le jeu</button></div>`}
 return`<div class="ov" data-act="ovclose"><div class="modal" role="dialog">${h}</div></div>`}

// ---------- actions ----------
const ACT={
 av(el){S.me.av=el.dataset.v;S.me.img=null;saveMe();S.sig='';onNet()},
 photo(){const f=$('#photo');f&&f.click()},
 nophoto(){S.me.img=null;saveMe();S.sig='';onNet()},
 create(){if(!readName())return;enter(rid(5),true)},
 join(){if(!readName())return;const c=($('#jcode').value||'').trim().toLowerCase();if(!/^[a-z0-9]{4,8}$/.test(c))return toast('Code invalide');enter(c,false)},
 leave(){leave()},
 takeover(){S.host=true;S.st=JSON.parse(JSON.stringify(S.lastSt));S.st.ep=Date.now();Net.set({h:true});S.lastPushed='';pushSt();saveSess();toast('Tu es maintenant l\'hôte')},
 copy(){const url=SHARE_URL?`${SHARE_URL}#${S.code}`:'';const t=`Rejoins ma partie Entre Nous 🎉 Code : ${S.code}`;
  const fallback=()=>{S.modal={t:'invite',url};onNet()};
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){navigator.share({title:'Entre Nous',text:t,url:url||undefined}).catch(e=>{if(e&&e.name!=='AbortError')fallback()});return}
  try{navigator.clipboard.writeText(url?t+'\n'+url:t).then(()=>toast('Invitation copiée !'),fallback)}catch(e){fallback()}},
 rules(el){S.modal={t:'rules',g:el.dataset.g};onNet()},
 scores(){S.modal={t:'scores'};onNet()},
 cfg(el){S.modal={t:'cfg',g:el.dataset.g};onNet()},
 close(){S.modal=null;onNet()},
 ovclose(el,e){if(e.target===el){S.modal=null;onNet()}},
 start(el){const k=el.dataset.g;const cfg={};
  if(k==='qdn'){const a=$('#c1').value,b=$('#c2').value;if(!a||!b||a===b)return toast('Choisis deux joueurs différents');cfg.cp=[a,b];}
  cfg.cats=catsOf(k).filter(c=>{const el=$('#cat-'+c);return el&&el.checked});if(!cfg.cats.length)return toast('Choisis au moins une catégorie');S.lastCats[k]=cfg.cats;
  if(k==='imp')cfg.mode=$('#impmode').value;
  const lr=document.querySelector('input[name=len]:checked');cfg.len=lr?+lr.value:10;S.lastLen[k]=cfg.len;if(k==='mdp'){cfg.wpp=cfg.len;cfg.len=0}
  S.modal=null;hostDo(st=>startGame(st,k,cfg))},
 finish(){S.modal=null;hostDo(doFinish)},
 replay(){hostDo(st=>startGame(st,st.g,st.cfg))},
 hmenu(){S.modal={t:'hmenu'};onNet()},
 tolobby(){S.modal=null;hostDo(st=>{settleDuo(st);st.g=null;st.ph=null})},
 next(){hostDo(doNext)},
 reveal(){hostDo(st=>doReveal(st))},
 tovote(){hostDo(st=>{st.ph='vote'})},
 resetsc(){hostDo(st=>{for(const k in st.sc)st.sc[k]=0;st.m=0;st.qn=0})},
 ans(el){answer(el.dataset.v)},
 mdpclue(){const g=G();if(!g||g.giver!==S.me.pid)return;const i=$('#mclue');const v=(i&&i.value||'').trim();const word=item(g).v;
  if(!v)return toast('Écris un indice');if(/\s/.test(v))return toast('Un seul mot !');
  const a=stemW(v),b=stemW(word);if(a.length>=3&&(a.includes(b)||b.includes(a)||sameWord(v,word)))return toast('Interdit : trop proche du mot de passe !');
  const cur=mdpClues(Object.assign({},Net.mine),g);if(cur.some(c=>normT(c)===normT(v)))return toast('Déjà donné !');if(cur.length>=5)return;
  Net.set({cl:{k:g.r,l:[...cur,v.slice(0,30)]}});i.value=''},
 ndsend(){const g=G();if(!g||g.g!=='nd'||myAns())return;const i=$('#ndans');const v=(i&&i.value||'').trim();if(!v)return toast('Écris une réponse');
  const step=item(g).v[g.si|0];const o=ndMatch(v,step[1]);if(o<0){toast('🤔 Pas reconnu pour ce thème, essaie autre chose');i.select();return}answer({o})},
 mdpskip(){const g=G();if(!g||g.giver!==S.me.pid)return;const cur=mdpClues(Object.assign({},Net.mine),g);Net.set({cl:{k:g.r,l:cur,skip:true}})},
 mdpguess(){const g=G();if(!g||myAns())return;const i=$('#mguess');const v=(i&&i.value||'').trim();if(!v)return toast('Écris ta réponse');if(/\s/.test(v)&&v.split(/\s+/).length>2)return toast('Un mot, pas une phrase !');
  const giver=present().find(p=>p.pid===g.giver);const n=mdpClues(giver,g).length;const tries=mdpTries(Object.assign({},Net.mine),g);if(tries.length>=n)return;
  const nt=[...tries];while(nt.length<n-1)nt.push('—');nt.push(v.slice(0,30));Net.set({gs:{k:g.r,l:nt}});
  if(sameWord(v,item(g).v)){answer({n});toast('🎉 Trouvé !')}else toast('❌ Raté !')},
 guessanim(){const g=G();if(!g||myAns()!==undefined)return;const i=$('#aguess');const v=(i&&i.value||'').trim();if(!v)return toast("Écris le nom d'un anime");
  if(matchTitle(v,item(g).v[0])){answer({ok:1,l:g.cl|0});toast('🎉 Bien joué !')}else{toast('❌ Raté, essaie encore');i.value='';const f=document.querySelector('.ainput');if(f){f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}i.focus()}},
 passanim(){if(myAns()===undefined)answer({ok:0})},
 nextclue(){hostDo(st=>{if(st.g!=='anim')return;st.cl=Math.min(2,(st.cl|0)+1);st.t0=Date.now()-st.cl*AN_STEP})},
 ansn(el){if(myAns()===undefined)answer(+el.dataset.v)},
 ansq(el){const g=G();if(myAns()===undefined)answer({o:+el.dataset.v,l:g.cl|0})},
 sendclue(){const v=($('#clue').value||'').trim();if(!v)return toast('Écris un indice');answer({c:v.slice(0,40)})},
 lockneedle(){answer(S.needle)},
 sendtxt(){const v=($('#dans').value||'').trim();if(!v)return toast('Écris ta réponse');answer(v.slice(0,60))},
 okt(el){const g=G();const cur=Net.mine.ok&&Net.mine.ok.k===g.r?Net.mine.ok.l.slice():[];const v=el.dataset.v;const i=cur.indexOf(v);if(i<0)cur.push(v);else cur.splice(i,1);Net.set({ok:{k:g.r,l:cur}})},
 word(){S.showWord=!S.showWord;onNet()}
};
function readName(){const n=($('#name').value||'').trim().slice(0,18);if(!n){toast('Entre ton prénom');$('#name').focus();return false}S.me.n=n;saveMe();return true}
function saveMe(){ls.set('en_me',{n:S.me.n,av:S.me.av,img:S.me.img||null})}
// photo de profil : recadrée en carré 80 px et compressée (~3 Ko) pour passer dans les messages temps réel
function loadPhoto(file){if(!file||!/^image\//.test(file.type))return toast('Choisis une image');const url=URL.createObjectURL(file);const im=new Image();
 im.onload=()=>{URL.revokeObjectURL(url);const c=document.createElement('canvas');c.width=c.height=80;const x=c.getContext('2d');const s=Math.min(im.width,im.height);
  x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,80,80);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>7000&&q>.3){q-=.15;d=c.toDataURL('image/jpeg',q)}
  if(!validImg(d))return toast('Image impossible à utiliser');const n=$('#name');if(n)S.me.n=(n.value||'').trim().slice(0,18);S.me.img=d;saveMe();S.sig='';onNet()};
 im.onerror=()=>{URL.revokeObjectURL(url);toast('Image illisible')};im.src=url}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='photo'){loadPhoto(e.target.files&&e.target.files[0]);e.target.value=''}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target&&e.target.id;
 const map={clue:'sendclue',dans:'sendtxt',jcode:'join',aguess:'guessanim',mclue:'mdpclue',mguess:'mdpguess',ndans:'ndsend',name:null};if(id in map&&map[id])ACT[map[id]]()});
// reset showWord à chaque manche
let lastR=null;setInterval(()=>{const g=G();if(g&&g.r!==lastR){lastR=g.r;if(S.showWord){S.showWord=false;onNet()}}},400);

// ---------- démarrage ----------
(function boot(){
 render();banner();
 let sess=ss.get('en_sess',null)||ls.get('en_sess',null);if(sess&&Date.now()-(sess.t||0)>6*3600e3)sess=null;
 const hc=(location.hash||'').slice(1).toLowerCase();
 if(sess&&sess.code&&S.me.n&&(!/^[a-z0-9]{4,8}$/.test(hc)||hc===sess.code))enter(sess.code,!!sess.host);
 Net.init();
 setInterval(onNet,1500);
})();

</script>
